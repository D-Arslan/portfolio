document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ing-top:26px;border-top:1px solid #E6DABA\">\n      <span style=\"font-size:13px;color:#A89770\">© 2026 Yalla Billetterie — Tous droits réservés.<\u002Fspan>\n      <a href=\"https://difarslan.com\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration:none;font-size:13px;color:#A89770\" style-hover=\"color:#1B7A54\">Réalisé par <span style=\"color:#1B7A54;font-weight:600\">Arslan DIF<\u002Fspan> — difarslan.com<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<sc-if value=\"{{ showCookie }}\" hint-placeholder-val=\"{{ false }}\">\n  <div role=\"dialog\" aria-label=\"Cookies\" style=\"position:fixed;left:0;right:0;bottom:0;z-index:70;padding:16px clamp(16px,4vw,40px);background:#fff;border-top:1px solid #E6DABA;box-shadow:0 -8px 30px rgba(36,27,12,0.08);animation:fadeUp .35s ease both\">\n    <div style=\"max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px\">\n      <p style=\"margin:0;flex:1;min-width:240px;font-size:14px;line-height:1.55;color:#5C4E33\">Nous utilisons des cookies pour améliorer votre expérience et mesurer l'audience. <button onclick=\"{{ openConfid }}\" style=\"background:none;border:none;padding:0;color:#1B7A54;font-weight:600;cursor:pointer;font-size:14px;text-decoration:underline\">En savoir plus<\u002Fbutton><\u002Fp>\n      <div style=\"display:flex;gap:10px\">\n        <button onclick=\"{{ refuseCookies }}\" style=\"height:44px;padding:0 22px;border:1px solid #DFD0AC;border-radius:999px;background:#fff;font-weight:600;font-size:14px;color:#5C4E33;cursor:pointer\">Refuser<\u002Fbutton>\n        <button onclick=\"{{ acceptCookies }}\" style=\"height:44px;padding:0 24px;border:none;border-radius:999px;background:linear-gradient(115deg,#1F8A5B,#1E8382);color:#fff;font-weight:600;font-size:14px;cursor:pointer\">Accepter<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ legalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div role=\"dialog\" aria-label=\"{{ legalTitle }}\" style=\"position:fixed;inset:0;z-index:90;background:rgba(36,27,12,0.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeUp .25s ease;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:clamp(16px,5vh,60px) 16px\">\n    <div style=\"width:100%;max-width:680px;background:#fff;border-radius:24px;overflow:hidden;animation:pop .3s ease both\">\n      <div style=\"position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px clamp(20px,4vw,36px);background:#fff;border-bottom:1px solid #E6DABA\">\n        <h2 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:clamp(22px,3.4vw,30px);color:#241B0C\">{{ legalTitle }}<\u002Fh2>\n        <button onclick=\"{{ closeLegal }}\" aria-label=\"Fermer\" style=\"width:44px;height:44px;flex:0 0 auto;background:#F1E7CE;border:none;border-radius:12px;font-size:18px;cursor:pointer;color:#1B6B47\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"padding:clamp(22px,4vw,36px)\">\n        <sc-for list=\"{{ legalBlocks }}\" as=\"b\" hint-placeholder-count=\"6\">\n          <sc-if value=\"{{ b.isH }}\" hint-placeholder-val=\"{{ false }}\"><h3 style=\"margin:22px 0 8px;font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:#1B7A54\">{{ b.text }}<\u002Fh3><\u002Fsc-if>\n          <sc-if value=\"{{ b.isP }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.7;color:#5C4E33\">{{ b.text }}<\u002Fp><\u002Fsc-if>\n        <\u002Fsc-for>\n        <p style=\"margin:22px 0 0;padding-top:16px;border-top:1px solid #E6DABA;font-size:12.5px;line-height:1.6;color:#A89770\">Ce site est une démonstration. Les informations légales ci-dessus sont fictives et fournies à titre d'illustration.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    view: 'home', cat: 'all', eventId: null, qty: {},\n    form: { prenom: '', nom: '', email: '', tel: '', consent: false, news: false, pay: 'cib' },\n    errors: {}, order: null,\n    cookie: null, showCookie: false, mobileMenu: false, legal: null,\n  };\n\n  componentDidMount() {\n    try {\n      const c = localStorage.getItem('yalla_cookie_v1');\n      this.setState(c ? { cookie: c, showCookie: false } : { showCookie: true });\n    } catch (e) { this.setState({ showCookie: true }); }\n  }\n\n  imgUrl(id) { try { if (window.__resources && window.__resources['ev_' + id]) return window.__resources['ev_' + id]; } catch (e) {} return 'images/events/' + id + '.jpg'; }\n  fmt(n) { return ('' + Math.round(n)).replace(/\\B(?=(\\d{3})+(?!\\d))/g, ' '); }\n  hashInt(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }\n\n  fmtDate(iso) {\n    const wd = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];\n    const mo = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];\n    const moS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];\n    const p = iso.split('-').map(Number); const d = new Date(p[0], p[1] - 1, p[2]);\n    return { weekday: wd[d.getDay()], day: d.getDate(), month: mo[d.getMonth()], monthShort: moS[d.getMonth()], full: wd[d.getDay()] + ' ' + d.getDate() + ' ' + mo[d.getMonth()] + ' ' + p[0] };\n  }\n\n  makeQR(seed) {\n    const N = 23; let h = this.hashInt(seed) || 1;\n    const rnd = () => { h = (Math.imul(h, 1103515245) + 12345) & 0x7fffffff; return h / 0x7fffffff; };\n    const inBox = (r, c, br, bc) => r >= br && r < br + 7 && c >= bc && c < bc + 7;\n    const isFinder = (r, c) => inBox(r, c, 0, 0) || inBox(r, c, 0, N - 7) || inBox(r, c, N - 7, 0);\n    let d = '';\n    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {\n      if (isFinder(r, c)) continue;\n      if (rnd() > 0.52) d += 'M' + c + ' ' + r + 'h1v1h-1z';\n    }\n    const finder = (br, bc) => { d += 'M' + bc + ' ' + br + 'h7v7h-7z' + 'M' + (bc + 1) + ' ' + (br + 1) + 'h5v5h-5z' + 'M' + (bc + 2) + ' ' + (br + 2) + 'h3v3h-3z'; };\n    finder(0, 0); finder(0, N - 7); finder(N - 7, 0);\n    return d;\n  }\n\n  data() {\n    const g = {\n      concert: 'linear-gradient(140deg,#1F8A5B,#155E63)',\n      festival: 'linear-gradient(140deg,#C9992F,#C1502E)',\n      club: 'linear-gradient(140deg,#1E8382,#2E5A8A)',\n      humour: 'linear-gradient(140deg,#C1502E,#D4A028)',\n      spectacle: 'linear-gradient(140deg,#1B6B47,#C1502E)',\n      expo: 'linear-gradient(140deg,#2A8F8A,#3C9A5F)',\n    };\n    const catLabels = { concert: 'Concert', festival: 'Festival', club: 'Soirée', humour: 'Humour', spectacle: 'Spectacle', expo: 'Expo' };\n    return [\n      { id: 'soolking', short: 'SOOLKING', title: 'Soolking — Live à Alger', cat: 'concert', dateISO: '2026-07-18', timeStr: '21h00', doorsStr: '19h30', venue: 'Coupole du 5-Juillet', city: 'Alger', description: 'L\\u2019enfant de Staoueli revient sur ses terres pour un concert événement. Deux heures de show, un nouveau live band et les tubes qui ont marqué toute une génération. Un rendez-vous à ne pas manquer sous la Coupole.', lineupLabel: 'Programmation', lineup: ['Soolking', 'DJ set d\\u2019ouverture', 'Invités surprises'], tiers: [{ id: 'eb', name: 'Early Bird', price: 2500, note: 'Quantité limitée' }, { id: 'std', name: 'Standard', price: 3500, note: 'Fosse debout' }, { id: 'vip', name: 'VIP', price: 6000, note: 'Accès prioritaire + bar' }, { id: 'or', name: 'Carré Or', price: 9000, note: 'Places assises face scène' }] },\n      { id: 'diwan', short: 'DIWAN\\nFEST', title: 'Festival Diwan d\\u2019Alger', cat: 'festival', dateISO: '2026-07-24', timeStr: '19h00', doorsStr: '18h00', venue: 'Théâtre de Verdure', city: 'Alger', description: 'Trois jours de fusion gnawa, chaâbi et musiques du monde au cœur du Théâtre de Verdure. Une programmation qui célèbre les racines et les métissages, du crépuscule jusqu\\u2019à tard dans la nuit.', lineupLabel: 'Line-up', lineup: ['Gnawa Diffusion', 'Cheikh Sidi Bémol', 'Index', 'Democratoz', 'Lella'], tiers: [{ id: 'j1', name: 'Pass 1 jour', price: 2000, note: 'Ven., sam. ou dim.' }, { id: 'j3', name: 'Pass 3 jours', price: 5000, note: 'Accès complet' }, { id: 'vip', name: 'VIP Pass', price: 8000, note: 'Espace VIP + rencontres' }] },\n      { id: 'electro', short: 'ROOF\\nTOP', title: 'Nuit Électro — Rooftop Sessions', cat: 'club', dateISO: '2026-08-01', timeStr: '23h00', doorsStr: '22h30', venue: 'Rooftop El Aurassi', city: 'Alger', description: 'La nuit électro la plus attendue de l\\u2019été, sur le toit de l\\u2019Aurassi avec vue panoramique sur la baie. House, mélodique et deep jusqu\\u2019au lever du soleil.', lineupLabel: 'Aux platines', lineup: ['Nassim Kouti', 'Skander', 'B2B Sunset', 'Résident El Aurassi'], tiers: [{ id: 'eb', name: 'Early Bird', price: 2000, note: 'Avant minuit' }, { id: 'std', name: 'Standard', price: 3000, note: 'Entrée + vestiaire' }, { id: 'table', name: 'Table (4 pers.)', price: 18000, note: 'Bouteille offerte' }] },\n      { id: 'secteur', short: 'STAND\\nUP', title: 'Abdelkader Secteur — Stand-up', cat: 'humour', dateISO: '2026-07-30', timeStr: '20h30', doorsStr: '20h00', venue: 'Salle Ibn Zeydoun', city: 'Riadh El Feth, Alger', description: 'Le maître de l\\u2019humour algérien présente son nouveau spectacle. Des sketches inédits, une observation aiguisée du quotidien, et deux heures de rire garanti pour toute la famille.', lineupLabel: 'Sur scène', lineup: ['Abdelkader Secteur', 'Première partie surprise'], tiers: [{ id: 'std', name: 'Standard', price: 1800, note: 'Placement libre' }, { id: 'prem', name: 'Premium', price: 2800, note: 'Rangs centraux' }, { id: 'vip', name: 'Carré VIP', price: 4500, note: 'Premiers rangs' }] },\n      { id: 'ballet', short: 'CASSE\\nNOIS.', title: 'Casse-Noisette — Ballet', cat: 'spectacle', dateISO: '2026-08-09', timeStr: '18h00', doorsStr: '17h15', venue: 'Opéra d\\u2019Alger Boualem Bessaïh', city: 'Ouled Fayet, Alger', description: 'Le célèbre ballet de Tchaïkovski dans une mise en scène féerique, porté par un orchestre live. Une soirée d\\u2019exception pour petits et grands à l\\u2019Opéra d\\u2019Alger.', lineupLabel: 'Distribution', lineup: ['Ballet national', 'Orchestre symphonique', 'Solistes invités'], tiers: [{ id: 'c3', name: 'Catégorie 3', price: 2200, note: 'Balcon' }, { id: 'c2', name: 'Catégorie 2', price: 3500, note: 'Corbeille' }, { id: 'c1', name: 'Catégorie 1', price: 5000, note: 'Orchestre' }, { id: 'loge', name: 'Loge', price: 7500, note: 'Loge privée' }] },\n      { id: 'biennale', short: 'BIEN\\nNALE', title: 'Biennale d\\u2019Art Contemporain', cat: 'expo', dateISO: '2026-07-15', timeStr: '10h — 19h', doorsStr: '10h00', venue: 'Musée d\\u2019Art Moderne (MaMa)', city: 'Alger-Centre', description: 'Un mois d\\u2019exposition réunissant une quarantaine d\\u2019artistes du continent africain. Installations, peinture, vidéo et performances autour du thème « Rivages ». Du 15 juillet au 15 août.', lineupLabel: 'Au programme', lineup: ['40 artistes', 'Performances live', 'Ateliers', 'Nocturnes du jeudi'], tiers: [{ id: 'ent', name: 'Entrée', price: 800, note: 'Accès 1 jour' }, { id: 'guide', name: 'Visite guidée', price: 1500, note: 'Avec médiateur' }, { id: 'pass', name: 'Pass saison', price: 2500, note: 'Accès illimité' }] },\n      { id: 'rimitti', short: 'RIMI\\nTTI', title: 'Cheikha Rimitti — Tribute', cat: 'concert', dateISO: '2026-08-07', timeStr: '21h30', doorsStr: '20h30', venue: 'Théâtre National Algérien (TNA)', city: 'Alger', description: 'Un hommage vibrant à la reine du raï, réunissant plusieurs voix de la scène algérienne actuelle. Une célébration du patrimoine musical, entre tradition
