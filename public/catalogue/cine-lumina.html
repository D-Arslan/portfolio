document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

255,255,.1);position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s\" style-hover=\"transform:translateY(-5px);box-shadow:0 18px 44px rgba(0,0,0,.5)\">\n              <image-slot id=\"poster-{{ f.id }}\" shape=\"rect\" fit=\"cover\" placeholder=\"Affiche\" style=\"position:absolute;inset:0;display:block;width:100%;height:100%\"><\u002Fimage-slot>\n              <div aria-hidden=\"true\" style=\"position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 64%,rgba(10,10,13,.62))\"><\u002Fdiv>\n              <div style=\"position:absolute;top:12px;left:12px;pointer-events:none;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;padding:4px 8px;background:rgba(10,10,13,.7);border:1px solid rgba(255,255,255,.14);border-radius:4px;color:var(--gold,#e8b84b)\">{{ f.note }}/5<\u002Fdiv>\n            <\u002Fdiv>\n            <div><div style=\"font-weight:800;font-size:18px;line-height:1.05;text-transform:uppercase;margin-bottom:6px\">{{ f.title }}<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:rgba(244,242,245,.6)\">{{ f.genre }} · {{ f.duree }} · {{ f.age }}<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold,#e8b84b);margin-top:6px\">Voir les séances →<\u002Fdiv><\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isFilm }}\">\n  <section style=\"padding:104px clamp(18px,4vw,54px) 80px;background:radial-gradient(80% 60% at 80% 0%,rgba(224,64,154,.12),transparent 55%),#0a0a0d;min-height:100vh\">\n    <div style=\"max-width:1160px;margin:0 auto\">\n      <button onclick=\"{{ goAffiche }}\" style=\"background:transparent;border:none;cursor:pointer;color:rgba(244,242,245,.6);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;margin-bottom:28px;padding:0\">← Retour à l’affiche<\u002Fbutton>\n      <div class=\"film-grid\">\n        <div>\n          <div role=\"img\" aria-label=\"Affiche du film {{ film.title }}\" style=\"aspect-ratio:2/3;border-radius:9px;background:{{ film.poster }};border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 70px rgba(0,0,0,.6);position:relative;overflow:hidden\">\n            <image-slot id=\"poster-{{ film.id }}\" shape=\"rect\" fit=\"cover\" placeholder=\"Affiche du film — déposez l’image\" style=\"position:absolute;inset:0;display:block;width:100%;height:100%\"><\u002Fimage-slot>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold,#e8b84b);margin-bottom:12px\">{{ film.genre }} · {{ film.duree }} · {{ film.age }} · Note {{ film.note }}/5<\u002Fdiv>\n          <h1 style=\"font-weight:900;font-size:clamp(36px,5.5vw,64px);letter-spacing:-.02em;line-height:.95;margin:0 0 20px;text-transform:uppercase\">{{ film.title }}<\u002Fh1>\n          <p style=\"font-size:17px;line-height:1.65;color:rgba(244,242,245,.78);margin:0 0 22px;max-width:560px\">{{ film.synopsis }}<\u002Fp>\n          <div style=\"display:flex;gap:26px;flex-wrap:wrap;margin-bottom:28px\">\n            <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,242,245,.5);margin-bottom:5px\">Réalisation<\u002Fdiv><div style=\"font-size:15px\">{{ film.director }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1;min-width:220px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,242,245,.5);margin-bottom:5px\">Distribution<\u002Fdiv><div style=\"font-size:15px\">{{ film.cast }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border-top:1px solid rgba(255,255,255,.1);padding-top:26px\">\n            <h2 style=\"font-weight:800;font-size:22px;margin:0 0 16px\">Séances<\u002Fh2>\n            <div style=\"display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap\">\n              <sc-for list=\"{{ dateTabs }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <button onclick=\"{{ d.onClick }}\" style=\"{{ d.style }}\">{{ d.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px\">\n              <sc-for list=\"{{ filmSeances }}\" as=\"s\" hint-placeholder-count=\"6\">\n                <button onclick=\"{{ s.onPick }}\" style=\"text-align:left;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:15px 16px;cursor:pointer;transition:all .18s\" style-hover=\"border-color:var(--gold,#e8b84b);background:rgba(232,184,75,.07)\">\n                  <div style=\"font-weight:800;font-size:22px;font-family:'IBM Plex Mono',monospace\">{{ s.time }}<\u002Fdiv>\n                  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--gold,#e8b84b);margin-top:5px\">{{ s.format }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:rgba(244,242,245,.55);margin-top:3px\">{{ s.salle }}<\u002Fdiv>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isReservation }}\">\n  <section style=\"padding:104px clamp(18px,4vw,54px) 80px;background:#0a0a0d;min-height:100vh\">\n    <div style=\"max-width:1200px;margin:0 auto\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;padding:18px 20px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(255,255,255,.02);margin-bottom:26px\">\n        <div>\n          <div style=\"font-weight:800;font-size:22px;text-transform:uppercase;line-height:1\">{{ seance.title }}<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(244,242,245,.62);margin-top:7px\">{{ seance.dateLabel }} · {{ seance.time }} · {{ seance.format }} · {{ seance.salle }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button onclick=\"{{ goAffiche }}\" style=\"background:transparent;border:1px solid rgba(255,255,255,.18);color:#f4f2f5;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:10px 16px;border-radius:4px;cursor:pointer\">Changer de séance<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:10px;margin-bottom:30px;flex-wrap:wrap\">\n        <sc-for list=\"{{ resSteps }}\" as=\"st\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <span style=\"{{ st.numStyle }}\">{{ st.n }}<\u002Fspan>\n            <span style=\"{{ st.labStyle }}\">{{ st.label }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ resStep1 }}\">\n        <div class=\"res-grid\">\n          <div style=\"background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:clamp(18px,3vw,32px)\">\n            <div style=\"position:relative;margin-bottom:34px\">\n              <div aria-hidden=\"true\" style=\"height:9px;border-radius:50%;margin:0 auto 8px;width:80%;background:linear-gradient(90deg,transparent,var(--gold,#e8b84b),transparent);box-shadow:0 0 40px 6px rgba(232,184,75,.4);animation:clGlow 5s ease-in-out infinite\"><\u002Fdiv>\n              <div style=\"text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:rgba(244,242,245,.5)\">Écran<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"overflow-x:auto;padding-bottom:8px\">\n              <div style=\"display:flex;flex-direction:column;gap:6px;min-width:max-content;margin:0 auto;width:max-content\">\n                <sc-for list=\"{{ seatRows }}\" as=\"row\" hint-placeholder-count=\"10\">\n                  <div style=\"display:flex;align-items:center;gap:6px\">\n                    <span style=\"width:16px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(244,242,245,.4);text-align:center\">{{ row.letter }}<\u002Fspan>\n                    <sc-for list=\"{{ row.seats }}\" as=\"seat\" hint-placeholder-count=\"12\">\n                      <button onclick=\"{{ seat.onClick }}\" disabled=\"{{ seat.occupied }}\" aria-label=\"{{ seat.aria }}\" style=\"{{ seat.style }}\">{{ seat.num }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                    <span style=\"width:16px\"><\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:16px;margin-top:26px;padding-top:20px;border-top:1px solid rgba(255,255,255,.08);font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(244,242,245,.6)\">\n              <span style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:15px;height:15px;border-radius:3px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.04)\"><\u002Fspan>Standard 600 DA<\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:15px;height:15px;border-radius:3px;border:1px solid rgba(232,184,75,.55);background:rgba(232,184,75,.1)\"><\u002Fspan>Premium 900 DA<\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:15px;height:15px;border-radius:3px;background:var(--gold,#e8b84b)\"><\u002Fspan>Sélectionné<\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:15px;height:15px;border-radius:3px;background:rgba(255,255,255,.07)\"><\u002Fspan>Occupé<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:26px;position:sticky;top:90px\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,242,245,.5);margin-bottom:14px\">Votre sélection<\u002Fdiv>\n            <sc-if value=\"{{ hasSeats }}\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px\">\n                <sc-for list=\"{{ selectedSeats }}\" as=\"s\" hint-placeholder-count=\"2\">\n                  <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 10px;border-radius:5px;background:rgba(232,184,75,.14);border:1px solid rgba(232,184,75,.4);color:var(--gold,#e8b84b)\">{{ s.code }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noSeats }}\">\n              <div style=\"font-size:14px;color:rgba(244,242,245,.5);margin-bottom:18px;line-height:1.5\">Choisissez un ou plusieurs sièges sur le plan.<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex;justify-content:space-between;font-size:14px;color:rgba(244,242,245,.7);padding:8px 0;border-top:1px solid rgba(255,255,255,.08)\"><span>{{ seatCount }} place(s)<\u002Fspan><span>{{ subtotalLabel }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:26px;margin:8px 0 20px\"><span style=\"font-size:14px;font-weight:500;color:rgba(244,242,245,.6)\">Total<\u002Fspan><span>{{ totalLabel }}<\u002Fspan><\u002Fdiv>\n            <button onclick=\"{{ toStep2 }}\" style=\"{{ step1BtnStyle }}\">Continuer<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ resStep2 }}\">\n        <div style=\"max-width:560px\">\n          <h2 style=\"font-weight:800;font-size:26px;margin:0 0 4px\">Vos coordonnées<\u002Fh2>\n          <p style=\"color:rgba(244,242,245,.6);font-size:14px;margin:0 0 24px\">{{ seatCount }} place(s) — {{ totalLabel }} · {{ selectedCodes }}<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <div><label for=\"r-name\" style=\"display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,242,245,.55);margin-bottom:8px\">Nom complet<\u002Flabel><input id=\"r-name\" value=\"{{ name }}\" oninput=\"{{ onName }}\" placeholder=\"Ex. Sarah Meziane\" style=\"width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.16);color:#f4f2f5;font-size:15px;padding:13px 14px;border-radius:5px;outline:none\"><\u002Fdiv>\n            <div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n              <div style=\"flex:1;min-width:160px\"><label for=\"r-email\" style=\"display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,242,245,.55);margin-bottom:8px\">Email<\u002Flabel><input id=\"r-email\" type=\"email\" value=\"{{ email }}\" oninput=\"{{ onEmail }}\" placeholder=\"vous@exemple.dz\" style=\"width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.16);color:#f4f2f5;font-size:15px;padding:13px 14px;border-radius:5px;outline:none\"><\u002Fdiv>\n              <div style=\"flex:1;min-width:160px\"><label for=\"r-phone\" style=\"display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,242,245,.55);margin-bottom:8px\">Téléphone<\u002Flabel><input id=\"r-phone\" type=\"tel\" value=\"{{ phone }}\" oninput=\"{{ onPhone }}\" placeholder=\"+213 __ __ __ __\" style=\"width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.16);color:#f4f2f5;font-size:15px;padding:13px 14px;border-radius:5px;outline:none\"><\u002Fdiv>\n            <\u002Fdiv>\n            <label style=\"display:flex;gap:11px;align-items:flex-start;cursor:pointer;font-size:13px;color:rgba(244,242,245,.7);line-height:1.5\">\n              <input type=\"checkbox\" checked=\"{{ consent }}\" onchange=\"{{ toggleConsent }}\" style=\"margin-top:3px;width:17px;height:17px;accent-color:var(--gold,#e8b84b);flex:none\">\n              <span>J’accepte que mes données servent à l’émission de mon billet, conformément à la <a href=\"#\" onclick=\"{{ openConf }}\" style=\"color:var(--gold,#e8b84b)\">politique de confidentialité<\u002Fa>.<\u002Fspan>\n            <\u002Flabel>\n            <div style=\"display:flex;gap:12px;margin-top:6px\">\n              <button onclick=\"{{ toStep1 }}\" style=\"background:transparent;border:1px solid rgba(255,255,255,.2);color:#f4f2f5;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:15px 22px;border-radius:4px;cursor:pointer\">Retour<\u002Fbutton>\n              <button onclick=\"{{ confirmBooking }}\" style=\"{{ step2BtnStyle }}\">Payer &amp; recevoir le billet<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ resStep3 }}\">\n        <div style=\"max-width:460px;margin:0 auto\">\n          <div style=\"text-align:center;margin-bottom:22px\"><div style=\"width:52px;height:52px;border-radius:50%;background:var(--gold,#e8b84b);color:#0a0a0d;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px\">✓<\u002Fdiv><h2 style=\"font-weight:800;font-size:26px;margin:0\">Billet confirmé<\u002Fh2><p style=\"color:rgba(244,242,245,.6);font-size:14px;margin:6px 0 0\">Présentez ce QR code à l’entrée de la salle.<\u002Fp><\u002Fdiv>\n          <div style=\"background:linear-gradient(160deg,#16161c,#0e0e12);border:1px solid rgba(255,255,255,.12);border-radius:14px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.6)\">\n            <div style=\"padding:24px 24px 18px\">\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold,#e8b84b);margin-bottom:6px\">Ciné Lumina · e-billet<\u002Fdiv>\n              <div style=\"font-weight:900;font-size:26px;text-transform:uppercase;line-height:1\">{{ seance.title }}<\u002Fdiv>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(244,242,245,.62);margin-top:8px\">{{ seance.dateLabel }} · {{ seance.time }} · {{ seance.format }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;padding:0 24px 18px;font-family:'IBM Plex Mono',monospace\">\n              <div><div style=\"font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,242,245,.45)\">Salle<\u002Fdiv><div style=\"font-size:16px;margin-top:3px\">{{ seance.salleNum }}<\u002Fdiv><\u002Fdiv>\n              <div><div style=\"font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,242,245,.45)\">Places<\u002Fdiv><div style=\"font-size:16px;margin-top:3px\">{{ selectedCodes }}<\u002Fdiv><\u002Fdiv>\n              <div><div style=\"font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,242,245,.45)\">Total<\u002Fdiv><div style=\"font-size:16px;margin-top:3px\">{{ totalLabel }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div aria-hidden=\"true\" style=\"height:0;border-top:2px dashed rgba(255,255,255,.16);margin:0 16px;position:relative\"><\u002Fdiv>\n            <div style=\"padding:24px;display:flex;flex-direction:column;align-items:center\">\n              <div role=\"img\" aria-label=\"QR code du billet\" style=\"width:172px;height:172px;background:#fff;padding:9px;border-radius:8px\">\n                <div style=\"width:100%;height:100%;display:grid;grid-template-columns:repeat({{ qrN }},1fr);grid-template-rows:repeat({{ qrN }},1fr)\">\n                  <sc-for list=\"{{ qrCells }}\" as=\"c\" hint-placeholder-count=\"625\">\n                    <div style=\"{{ c.style }}\"><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:rgba(244,242,245,.7);margin-top:14px\">RÉF · {{ ref }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;margin-top:20px\">\n            <button onclick=\"{{ goAffiche }}\" style=\"flex:1;background:transparent;border:1px solid rgba(255,255,255,.2);color:#f4f2f5;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:15px;border-radius:4px;cursor:pointer\">Autres films<\u002Fbutton>\n            <button onclick=\"{{ resetBooking }}\" style=\"flex:1;background:var(--gold,#e8b84b);border:none;color:#0a0a0d;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:15px;border-radius:4px;cursor:pointer\">Nouvelle résa<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isInfos }}\">\n  <section style=\"padding:110px clamp(18px,4vw,54px) 80px;background:#0a0a0d;min-height:100vh\">\n    <div style=\"max-width:1160px;margin:0 auto\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold,#e8b84b);margin-bottom:10px\">Le cinéma<\u002Fdiv>\n      <h1 style=\"font-weight:900;font-size:clamp(38px,6vw,68px);letter-spacing:-.02em;margin:0 0 40px;text-transform:uppercase\">Infos pratiques<\u002Fh1>\n      <div class=\"hero-cine\" style=\"margin-bottom:56px\">\n        <div>\n          <div style=\"display:flex;flex-direction:column;gap:20px\">\n            <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,242,245,.5);margin-bottom:5px\">Adresse<\u002Fdiv><div style=\"font-size:17px\">28, Rue Didouche Mourad — Alger-Centre, 16000<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,242,245,.5);margin-bottom:5px\">Horaires<\u002Fdiv><div style=\"font-size:17px\">7j/7 · 11h00 → minuit · Dernière séance 22h30<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,242,245,.5);margin-bottom:5px\">Téléphone<\u002Fdiv><div style=\"font-size:17px\">+213 _ __ __ __ __<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,242,245,.5);margin-bottom:5px\">Accès<\u002Fdiv><div style=\"font-size:15px;color:rgba(244,242,245,.72);line-height:1.55\">Métro Tafourah-Grande Poste (5 min). Bus 27 / 41. Parking Sofia à 200 m. Salles accessibles PMR.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <image-slot id=\"lum-facade\" shape=\"rounded\" radius=\"9\" fit=\"cover\" placeholder=\"Façade / entrée du cinéma — déposez la photo\" style=\"display:block;width:100%;aspect-ratio:4/3;border:1px solid rgba(255,255,255,.1);border-radius:9px\"><\u002Fimage-slot>\n      <\u002Fdiv>\n\n      <h2 style=\"font-weight:800;font-size:26px;margin:0 0 18px\">Tarifs<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:56px\">\n        <div style=\"border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:22px\"><div style=\"font-weight:800;font-size:30px\">600 DA<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(244,242,245,.6);margin-top:6px\">Standard 2D<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid rgba(232,184,75,.35);border-radius:8px;padding:22px;background:rgba(232,184,75,.06)\"><div style=\"font-weight:800;font-size:30px;color:var(--gold,#e8b84b)\">900 DA<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(244,242,245,.6);margin-top:6px\">Premium / 3D<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:22px\"><div style=\"font-weight:800;font-size:30px\">480 DA<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(244,242,245,.6);margin-top:6px\">Lundi (-20%)<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:22px\"><div style=\"font-weight:800;font-size:30px\">450 DA<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(244,242,245,.6);margin-top:6px\">Étudiant / -12 ans<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <h2 style=\"font-weight:800;font-size:26px;margin:0 0 18px\">Questions fréquentes<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:2px\">\n        <sc-for list=\"{{ faq }}\" as=\"q\" hint-placeholder-count=\"4\">\n          <button onclick=\"{{ q.onToggle }}\" style=\"text-align:left;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.09);padding:18px 0;cursor:pointer\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px\"><span style=\"font-weight:600;font-size:17px;color:#f4f2f5\">{{ q.q }}<\u002Fspan><span style=\"color:var(--gold,#e8b84b);font-size:18px\">{{ q.icon }}<\u002Fspan><\u002Fdiv>\n            <sc-if value=\"{{ q.open }}\"><div style=\"font-size:15px;color:rgba(244,242,245,.65);line-height:1.6;margin-top:12px;max-width:720px\">{{ q.a }}<\u002Fdiv><\u002Fsc-if>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<footer style=\"position:relative;z-index:2;padding:clamp(48px,6vw,72px) clamp(18px,4vw,54px) 30px;background:#08080b;border-top:1px solid rgba(255,255,255,.08)\">\n  <div style=\"max-width:1240px;margin:0 auto\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:36px;padding-bottom:42px;border-bottom:1px solid rgba(255,255,255,.08)\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px\"><span aria-hidden=\"true\" style=\"width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff,var(--gold,#e8b84b) 42%,var(--goldDeep,#c99a2e))\"><\u002Fspan><span style=\"font-weight:900;font-size:18px;letter-spacing:.22em\">LUMINA<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:13px;color:rgba(244,242,245,.55);line-height:1.6;max-width:230px;margin:0\">Cinéma de quartier, 4 salles, au cœur d’Alger. Le grand écran comme au premier jour.<\u002Fp>\n      <\u002Fdiv>\n      <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold,#e8b84b);margin-bottom:13px\">Naviguer<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:9px;font-size:14px\"><a href=\"#\" onclick=\"{{ goAffiche }}\" style=\"text-decoration:none;color:rgba(244,242,245,.7)\">À l’affiche<\u002Fa><a href=\"#\" onclick=\"{{ goReservation }}\" style=\"text-decoration:none;color:rgba(244,242,245,.7)\">Réservation<\u002Fa><a href=\"#\" onclick=\"{{ goInfos }}\" style=\"text-decoration:none;color:rgba(244,242,245,.7)\">Infos pratiques<\u002Fa><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold,#e8b84b);margin-bottom:13px\">Contact<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:9px;font-size:14px;color:rgba(244,242,245,.7)\"><span>28, Rue Didouche Mourad, Alger<\u002Fspan><span>+213 _ __ __ __ __<\u002Fspan><span>contact@cinelumina.dz<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold,#e8b84b);margin-bottom:13px\">Légal<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:9px;font-size:14px\"><a href=\"#\" onclick=\"{{ openMentions }}\" style=\"text-decoration:none;color:rgba(244,242,245,.7)\">Mentions légales<\u002Fa><a href=\"#\" onclick=\"{{ openConf }}\" style=\"text-decoration:none;color:rgba(244,242,245,.7)\">Confidentialité<\u002Fa><a href=\"#\" onclick=\"{{ openCookiePrefs }}\" style=\"text-decoration:none;color:rgba(244,242,245,.7)\">Gérer les cookies<\u002Fa><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding-top:24px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(244,242,245,.4)\">© {{ year }} Ciné Lumina — Alger<\u002Fspan>\n      <a href=\"https://difarslan.com\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:rgba(244,242,245,.5);transition:color .2s\" style-hover=\"color:var(--gold,#e8b84b)\">Réalisé par Arslan DIF — difarslan.com<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<sc-if value=\"{{ legal }}\">\n  <div onclick=\"{{ closeLegal }}\" style=\"position:fixed;inset:0;z-index:80;background:rgba(6,6,9,.86);backdrop-filter:blur(6px);display:flex;justify-content:center;padding:clamp(16px,5vh,60px) 16px;overflow-y:auto\">\n    <div onclick=\"{{ stop }}\" style=\"position:relative;max-width:760px;width:100%;background:#101015;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:clamp(26px,4vw,50px);height:max-content;box-shadow:0 40px 90px rgba(0,0,0,.7)\">\n      <button onclick=\"{{ closeLegal }}\" aria-label=\"Fermer\" style=\"position:absolute;top:18px;right:18px;width:40px;height:40px;background:transparent;border:1px solid rgba(255,255,255,.2);border-radius:4px;color:#f4f2f5;font-size:18px;cursor:pointer\">×<\u002Fbutton>\n      <h2 style=\"font-weight:800;font-size:clamp(26px,4vw,40px);margin:0 0 24px;letter-spacing:-.01em\">{{ legalTitle }}<\u002Fh2>\n      <sc-for list=\"{{ legalBody }}\" as=\"p\" hint-placeholder-count=\"6\">\n        <div style=\"margin-bottom:20px\">\n          <sc-if value=\"{{ p.h }}\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold,#e8b84b);margin-bottom:8px\">{{ p.h }}<\u002Fdiv><\u002Fsc-if>\n          <p style=\"font-size:15px;line-height:1.7;color:rgba(244,242,245,.72);margin:0\">{{ p.t }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showCookie }}\">\n  <div role=\"dialog\" aria-label=\"Préférences cookies\" style=\"position:fixed;left:16px;right:16px;bottom:16px;z-index:70;max-width:520px;margin:0 auto;background:#111116;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:22px 24px;box-shadow:0 26px 60px rgba(0,0,0,.6)\">\n    <div style=\"font-weight:800;font-size:19px;margin-bottom:8px\">Nous respectons votre vie privée<\u002Fdiv>\n    <p style=\"font-size:13px;line-height:1.6;color:rgba(244,242,245,.66);margin:0 0 18px\">Cookies utilisés pour améliorer votre expérience et mesurer l’audience. Voir notre <a href=\"#\" onclick=\"{{ openConf }}\" style=\"color:var(--gold,#e8b84b)\">politique de confidentialité<\u002Fa>.<\u002Fp>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n      <button onclick=\"{{ acceptCookies }}\" style=\"flex:1;min-width:130px;background:var(--gold,#e8b84b);color:#0a0a0d;border:none;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:13px 18px;border-radius:4px;cursor:pointer\">Tout accepter<\u002Fbutton>\n      <button onclick=\"{{ declineCookies }}\" style=\"flex:1;min-width:130px;background:transparent;color:#f4f2f5;border:1px solid rgba(255,255,255,.2);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:13px 18px;border-radius:4px;cursor:pointer\">Refuser<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e8b84b&quot;,&quot;options&quot;:[[&quot;#e8b84b&quot;,&quot;#c99a2e&quot;],[&quot;#f0503c&quot;,&quot;#c43a2a&quot;],[&quot;#4aa3ff&quot;,&quot;#2e6fd0&quot;],[&quot;#3fd0a0&quot;,&quot;#2a9e78&quot;]],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Identité&quot;},&quot;glowColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e0409a&quot;,&quot;options&quot;:[&quot;#e0409a&quot;,&quot;#8a5cff&quot;,&quot;#ff6a3d&quot;,&quot;#25c2c2&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Identité&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    view: 'accueil', mobileNav: false, legal: null, showCookie: false,\n    genre: 'Tous', filmId: 'f2', seanceDate: null, seance: null,\n    resStep: 1, seats: [], name: '', email: '', phone: '', consent: false, ref: '',\n    openFaq: 0\n  };\n\n  componentDidMount() {\n    try { if (!localStorage.getItem('lum_cookie')) this.setState({ showCookie: true }); } catch (e) { this.setState({ showCookie: true }); }\n  }\n\n  FILMS = [\n    { id: 'f1', title: 'Les Sentiers de l’Aube', genre: 'Drame', duree: '2h08', age: 'Tous publics', note: '4,5', director: 'Nadir Benhamou', cast: 'Lina Cherifi, Omar Taleb, Yasmina Rahal, Sofiane Bey', poster: 'linear-gradient(155deg,#3a1c0e,#8a4a1e 55%,#e8b84b)', synopsis: 'Au petit matin sur les hauteurs de Ghardaïa, une jeune institutrice fait le pari de rouvrir une école oubliée. Un premier long-métrage lumineux sur la transmission et l’espoir.' },\n    { id: 'f2', title: 'Nébuleuse', genre: 'Science-fiction', duree: '2h22', age: '12+', note: '4,7', director: 'Camille Ferrand', cast: 'Inès Delacroix, Marwan Saïdi, Théo Lenoir, Anaïs Kaci', poster: 'linear-gradient(160deg,#0b1030,#3a1560 50%,#e0409a)', synopsis: 'En 2189, l’équipage du vaisseau Meridian intercepte un signal venu d’une nébuleuse morte. Un vertige spatial à couper le souffle, entre 2001 et la grande tradition du space opera.' },\n    { id: 'f3', title: 'Le Dernier Métro d’Alger', genre: 'Thriller', duree: '1h54', age: '12+', note: '4,3', director: 'Rachid Mansour', cast: 'Karim Belaïd, Sofia Nour, Dris Hamlaoui, Emma Vitale', poster: 'linear-gradient(150deg,#06201f,#0d3b3a 45%,#c0392b)', synopsis: 'Une nuit, un contrôleur découvre un colis abandonné sur le quai désert. Course contre la montre nerveuse dans les entrailles de la ville qui ne dort jamais.' },\n    { id: 'f4', title: 'Yasmine & les Étoiles', genre: 'Animation', duree: '1h36', age: 'Tous publics', note: '4,6', director: 'Studio Anka', cast: 'Voix : Meriem Aït, Youcef Larbi, Chloé Renard', poster: 'linear-gradient(150deg,#2a1150,#7a2a9a 50%,#ff8fc7)', synopsis: 'Yasmine, huit ans, capture les étoiles filantes dans un bocal pour illuminer le quartier privé d’électricité. Une fable animée tendre et poétique pour toute la famille.' },\n    { id: 'f5', title: 'La Traversée', genre: 'Aventure', duree: '2h15', age: '10+', note: '4,2', director: 'Elena Marchetti', cast: 'Léo Fontaine, Amira Slimani, Björn Halvorsen, Nadia Cohen', poster: 'linear-gradient(155deg,#05231f,#0e5f4e 50%,#3fd0a0)', synopsis: 'De la côte kabyle jusqu’aux fjords, deux frères que tout oppose reprennent le voilier de leur père. Un grand film d’aventure sur la mer et la réconciliation.' },\n    { id: 'f6', title: 'Silence Radio', genre: 'Comédie', duree: '1h48', age: 'Tous publics', note: '4,1', director: 'Hakim Zerrouki', cast: 'Selma Boudjellal, Riad Ferhat, Manon Girard, Tarek Ould', poster: 'linear-gradient(155deg,#3a1508,#a5471a 52%,#f2b84a)', synopsis: 'Une radio de quartier menacée de fermeture tente un ultime coup d’éclat : 48 h d’antenne non-stop. Comédie chorale réjouissante sur la voix des sans-voix.' }\n  ];\n\n  hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }\n  mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\n\n  dateInfo(offset) {\n    const d = new Date(); d.setDate(d.getDate() + offset);\n    const iso = d.toISOString().slice(0, 10);\n    let label;\n    if (offset === 0) label = 'Aujourd’hui';\n    else if (offset === 1) label = 'Demain';\n    else label = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'short' });\n    return { iso, label, short: d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric' }) };\n  }\n\n  seancesFor(filmId) {\n    const rnd = this.mulberry32(this.hashStr(filmId));\n    const times = ['13:30', '15:45', '18:00', '20:30', '22:30'];\n    const formats = ['VF · 2D', 'VO · 2D', 'VF · 3D', 'VO · 3D'];\n    const out = [];\n    for (let day = 0; day < 3; day++) {\n      const di = this.dateInfo(day);\n      const n = 2 + Math.floor(rnd() * 2);\n      const used = new Set();\n      for (let k = 0; k < n; k++) {\n        let ti = Math.floor(rnd() * times.length);\n        while (used.has(ti)) ti = (ti + 1) % times.length;\n        used.add(ti);\n        const salleNum = 1 + Math.floor(rnd() * 4);\n        const format = formats[Math.floor(rnd() * formats.length)];\n        out.push({ id: filmId + '-' + di.iso + '-' + times[ti], filmId, dateISO: di.iso, dateLabel: di.label, dateShort: di.short, dayOffset: day, time: times[ti], salleNum: salleNum, salle: 'Salle ' + salleNum, format });\n      }\n    }\n    out.sort((a, b) => a.dayOffset - b.dayOffset || (a.time < b.time ? -1 : 1));\n    return out;\n  }\n\n  seatModel(seance) {\n    const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];\n    const perRow = 12;\n    const seed = seance ? this.hashStr(seance.id) : 12345;\n    const rnd = this.mulberry32(seed);\n    const occ = new Set();\n    while (occ.size < 22) { const r = letters[Math.floor(rnd() * letters.length)]; const c = 1 + Math.floor(rnd() * perRow); occ.add(r + c); }\n    const rows = letters.map((letter, ri) => {\n      const seats = [];\n      for (let n = 1; n <= perRow; n++) {\n        const premium = ri >= 2 && ri <= 6 && n >= 4 && n <= 9;\n        const code = letter + n;\n        seats.push({ code, num: n, premium, occupied: occ.has(code), aisle: (n === 4 || n === 10) });\n      }\n      return { letter, seats };\n    });\n    return rows;\n  }\n\n  toggleSeat(code) { this.setState((s) => { const has = s.seats.includes(code); if (has) return { seats: s.seats.filter((x) => x !== code) }; if (s.seats.length >= 8) return {}; return { seats: [...s.seats, code] }; }); }\n  seatPrice(code) { const row = code.charCodeAt(0) - 65; const num = parseInt(code.slice(1), 10); const premium = row >= 2 && row <= 6 && num >= 4 && num <= 9; return premium ? 900 : 600; }\n\n  go = (view) => (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ view, mobileNav: false }); setTimeout(() => window.scrollTo({ top: 0, behavior: 'auto' }), 0); };\n  openFilm = (id) => (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ filmId: id, view: 'film', seanceDate: null, mobileNav: false }); setTimeout(() => window.scrollTo({ top: 0, behavior: 'auto' }), 0); };\n  pickSeance = (seance) => (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ seance, view: 'reservation', resStep: 1, seats: [], ref: '' }); setTimeout(() => window.scrollTo({ top: 0, behavior: 'auto' }), 0); };\n\n  toggleNav = () => this.setState({ mobil
