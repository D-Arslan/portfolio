document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ody{margin:0;padding:0}\nbody{background:#F7F1E7;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\n::selection{background:#B08D57;color:#fff}\ninput,select,button,textarea{font-family:inherit}\n@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}\n@keyframes fadein{from{opacity:0}to{opacity:1}}\n@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}\n<\u002Fstyle>\n<script src=\"683db577-89bf-4874-95fe-46b30731f71f\"><\u002Fscript>\n<\u002Fhelmet>\n<div style=\"font-family:'Jost',sans-serif;color:#17302E;background:#F7F1E7;min-height:100vh;display:flex;flex-direction:column;\">\n\n  <a href=\"#contenu\" style=\"position:absolute;left:-9999px;top:0;background:#1E5F5A;color:#fff;padding:12px 18px;z-index:200;font-size:13px;\" style-focus=\"left:12px;top:12px;outline:2px solid #B08D57;\">Aller au contenu<\u002Fa>\n\n  <sc-if value=\"{{ showCookie }}\">\n    <div role=\"region\" aria-label=\"Gestion des cookies\" style=\"position:fixed;left:0;right:0;bottom:0;z-index:150;background:#17302E;color:#EDE4D3;padding:18px clamp(16px,5vw,48px);display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px;box-shadow:0 -12px 40px -20px rgba(0,0,0,.5);\">\n      <p style=\"margin:0;flex:1;min-width:240px;font-size:13.5px;line-height:1.6;font-weight:300;color:#DED3BF;\">Nous utilisons des cookies pour mesurer l’audience et améliorer votre expérience. Vous pouvez les accepter ou les refuser. En savoir plus dans notre <a href=\"#\" onclick=\"{{ nav }}\" style=\"color:#CBAE7A;text-decoration:underline;text-underline-offset:2px;\">politique de confidentialité<\u002Fa>.<\u002Fp>\n      <div style=\"display:flex;gap:12px;\">\n        <button onclick=\"{{ refuseCookie }}\" style=\"font-family:'Jost';font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:12px 22px;background:transparent;color:#EDE4D3;border:1px solid rgba(237,228,211,.4);cursor:pointer;transition:all .25s ease;\" style-hover=\"border-color:#EDE4D3;\" style-focus=\"outline:2px solid #CBAE7A;outline-offset:2px;\">Refuser<\u002Fbutton>\n        <button onclick=\"{{ acceptCookie }}\" style=\"font-family:'Jost';font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:12px 22px;background:#B08D57;color:#17302E;border:1px solid #B08D57;cursor:pointer;font-weight:500;transition:all .25s ease;\" style-hover=\"background:#C6A469;\" style-focus=\"outline:2px solid #EDE4D3;outline-offset:2px;\">Accepter<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <header style=\"position:sticky;top:0;z-index:120;background:rgba(247,241,231,.88);backdrop-filter:blur(12px);border-bottom:1px solid rgba(176,141,87,.28);\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(16px,5vw,48px);height:74px;display:flex;align-items:center;justify-content:space-between;gap:24px;\">\n      <button onclick=\"{{ nav }}\" aria-label=\"Dar el Bahr — accueil\" style=\"display:flex;align-items:center;gap:12px;background:none;border:none;cursor:pointer;padding:0;text-align:left;\" style-focus=\"outline:2px solid #1E5F5A;outline-offset:4px;\">\n        <span aria-hidden=\"true\" style=\"width:16px;height:16px;background:#B08D57;transform:rotate(45deg);display:inline-block;flex:none;\"><\u002Fspan>\n        <span style=\"display:flex;flex-direction:column;line-height:1;\">\n          <span style=\"font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:600;letter-spacing:.04em;color:#17302E;\">Dar el Bahr<\u002Fspan>\n          <span style=\"font-family:'Jost';font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:#8A7A5A;margin-top:3px;\">Hôtel &amp; Spa · Tipaza<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fbutton>\n\n      <sc-if value=\"{{ notMobile }}\">\n        <nav aria-label=\"Navigation principale\" style=\"display:flex;align-items:center;gap:30px;\">\n          <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"5\">\n            <button onclick=\"{{ item.go }}\" style=\"position:relative;background:none;border:none;cursor:pointer;font-family:'Jost';font-size:13px;letter-spacing:.06em;color:#2E4440;padding:6px 0;transition:color .25s ease;\" style-hover=\"color:#1E5F5A;\" style-focus=\"outline:2px solid #1E5F5A;outline-offset:3px;\">\n              {{ item.label }}\n              <sc-if value=\"{{ item.active }}\"><span aria-hidden=\"true\" style=\"position:absolute;left:0;right:0;bottom:-2px;height:1.5px;background:#B08D57;\"><\u002Fspan><\u002Fsc-if>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n          <button onclick=\"{{ openReservation }}\" style=\"font-family:'Jost';font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;padding:13px 26px;background:#1E5F5A;color:#F7F1E7;border:none;cursor:pointer;transition:background .3s ease;\" style-hover=\"background:#143f3b;\" style-focus=\"outline:2px solid #B08D57;outline-offset:2px;\">Réserver<\u002Fbutton>\n        <\u002Fnav>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isMobile }}\">\n        <button onclick=\"{{ toggleMenu }}\" aria-label=\"Ouvrir le menu\" aria-expanded=\"{{ menuOpen }}\" style=\"display:flex;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:8px;\" style-focus=\"outline:2px solid #1E5F5A;outline-offset:2px;\">\n          <span aria-hidden=\"true\" style=\"width:26px;height:1.5px;background:#17302E;display:block;\"><\u002Fspan>\n          <span aria-hidden=\"true\" style=\"width:26px;height:1.5px;background:#17302E;display:block;\"><\u002Fspan>\n          <span aria-hidden=\"true\" style=\"width:26px;height:1.5px;background:#17302E;display:block;\"><\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ menuOpen }}\">\n    <div style=\"position:fixed;inset:74px 0 0 0;z-index:110;background:#F7F1E7;display:flex;flex-direction:column;padding:24px clamp(20px,7vw,48px);\">\n      <nav aria-label=\"Navigation mobile\" style=\"display:flex;flex-direction:column;\">\n        <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"5\">\n          <button onclick=\"{{ item.go }}\" style=\"text-align:left;background:none;border:none;border-bottom:1px solid rgba(176,141,87,.25);cursor:pointer;font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:500;color:#17302E;padding:20px 0;\" style-focus=\"outline:2px solid #1E5F5A;\">{{ item.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fnav>\n      <button onclick=\"{{ openReservation }}\" style=\"margin-top:32px;font-family:'Jost';font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;padding:18px;background:#1E5F5A;color:#F7F1E7;border:none;cursor:pointer;\">Réserver un séjour<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <main id=\"contenu\" style=\"flex:1;\">\n\n    <!-- ================= ACCUEIL ================= -->\n    <sc-if value=\"{{ isAccueil }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <section style=\"background:linear-gradient(168deg,#faf4e9 0%,#f1e6d1 38%,#dbe8e3 74%,#c2d8d1 100%);padding:clamp(48px,7vw,88px) clamp(16px,5vw,48px) clamp(64px,8vw,110px);\">\n          <div style=\"max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(32px,5vw,64px);align-items:center;\">\n            <div>\n              <p style=\"font-family:'Jost';font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:#A9854A;margin:0 0 22px;\">Tipaza · Côte méditerranéenne<\u002Fp>\n              <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(44px,7vw,82px);line-height:1.02;letter-spacing:-.01em;color:#15302D;margin:0 0 24px;\">Le luxe discret,<br>face à la mer.<\u002Fh1>\n              <p style=\"font-size:clamp(16px,1.4vw,18px);line-height:1.8;font-weight:300;color:#3D4F49;max-width:460px;margin:0 0 34px;\">Un havre balnéaire de six hébergements d’exception, un spa d’inspiration méditerranéenne et une plage privée sur la baie de Tipaza. L’art de recevoir, à l’algérienne.<\u002Fp>\n              <div style=\"display:flex;flex-wrap:wrap;gap:14px;\">\n                <button onclick=\"{{ openReservation }}\" style=\"font-family:'Jost';font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;padding:16px 34px;background:#1E5F5A;color:#F7F1E7;border:none;cursor:pointer;transition:background .3s ease;\" style-hover=\"background:#143f3b;\" style-focus=\"outline:2px solid #B08D57;outline-offset:2px;\">Réserver un séjour<\u002Fbutton>\n                <button onclick=\"{{ nav }}\" data-nav=\"chambres\" style=\"font-family:'Jost';font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;padding:16px 32px;background:transparent;color:#17302E;border:1px solid #B08D57;cursor:pointer;transition:all .3s ease;\" style-hover=\"background:#B08D57;color:#fff;\" style-focus=\"outline:2px solid #1E5F5A;outline-offset:2px;\">Découvrir les suites<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:relative;aspect-ratio:4/5;min-height:320px;border-radius:4px;overflow:hidden;box-shadow:0 40px 90px -50px rgba(21,48,45,.6);\">\n              <image-slot id=\"photo-hero\" shape=\"rect\" fit=\"cover\" placeholder=\"Photo — façade &amp; baie au lever du jour (portrait 4:5)\" style=\"width:100%;height:100%;display:block;\"><\u002Fimage-slot>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- Booking bar -->\n        <section style=\"padding:0 clamp(16px,5vw,48px);margin-top:clamp(-56px,-5vw,-64px);position:relative;z-index:5;\">\n          <div style=\"max-width:1080px;margin:0 auto;background:#FFFDF9;border:1px solid rgba(176,141,87,.3);box-shadow:0 30px 70px -40px rgba(21,48,45,.45);padding:clamp(20px,3vw,30px);\">\n            <p style=\"font-family:'Jost';font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#A9854A;margin:0 0 18px;\">Vérifier les disponibilités<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:18px 22px;align-items:flex-end;\">\n              <div style=\"flex:1;min-width:150px;\">\n                <label for=\"hb-arr\" style=\"display:block;font-family:'Jost';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8A9591;margin:0 0 8px;font-weight:500;\">Arrivée<\u002Flabel>\n                <input id=\"hb-arr\" type=\"date\" value=\"{{ arrivee }}\" min=\"{{ today }}\" onchange=\"{{ setArrivee }}\" style=\"width:100%;font-family:'Jost';font-size:15px;padding:12px 12px;border:1px solid rgba(23,48,46,.2);background:#fff;color:#17302E;border-radius:2px;outline:none;\" style-focus=\"border-color:#1E5F5A;box-shadow:0 0 0 3px rgba(30,95,90,.15);\">\n              <\u002Fdiv>\n              <div style=\"flex:1;min-width:150px;\">\n                <label for=\"hb-dep\" style=\"display:block;font-family:'Jost';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8A9591;margin:0 0 8px;font-weight:500;\">Départ<\u002Flabel>\n                <input id=\"hb-dep\" type=\"date\" value=\"{{ depart }}\" min=\"{{ arrivee }}\" onchange=\"{{ setDepart }}\" style=\"width:100%;font-family:'Jost';font-size:15px;padding:12px 12px;border:1px solid rgba(23,48,46,.2);background:#fff;color:#17302E;border-radius:2px;outline:none;\" style-focus=\"border-color:#1E5F5A;box-shadow:0 0 0 3px rgba(30,95,90,.15);\">\n              <\u002Fdiv>\n              <div style=\"flex:1.4;min-width:200px;\">\n                <label for=\"hb-room\" style=\"display:block;font-family:'Jost';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8A9591;margin:0 0 8px;font-weight:500;\">Hébergement<\u002Flabel>\n                <select id=\"hb-room\" value=\"{{ roomId }}\" onchange=\"{{ setRoom }}\" style=\"width:100%;font-family:'Jost';font-size:15px;padding:12px 12px;border:1px solid rgba(23,48,46,.2);background:#fff;color:#17302E;border-radius:2px;outline:none;cursor:pointer;\" style-focus=\"border-color:#1E5F5A;box-shadow:0 0 0 3px rgba(30,95,90,.15);\">\n                  <sc-for list=\"{{ roomsView }}\" as=\"r\" hint-placeholder-count=\"6\"><option value=\"{{ r.id }}\">{{ r.optLabel }}<\u002Foption><\u002Fsc-for>\n                <\u002Fselect>\n              <\u002Fdiv>\n              <button onclick=\"{{ openReservation }}\" style=\"flex:none;font-family:'Jost';font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;padding:15px 30px;background:#1E5F5A;color:#F7F1E7;border:none;cursor:pointer;transition:background .3s ease;\" style-hover=\"background:#143f3b;\" style-focus=\"outline:2px solid #B08D57;outline-offset:2px;\">Voir le récapitulatif<\u002Fbutton>\n            <\u002Fdiv>\n            <p style=\"margin:18px 0 0;font-size:12.5px;color:#7C8883;font-weight:300;\">Meilleur tarif garanti · Annulation gratuite jusqu’à 48 h avant l’arrivée · Acompte de 30 %.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- Intro -->\n        <section style=\"padding:clamp(64px,9vw,120px) clamp(16px,5vw,48px) clamp(32px,5vw,56px);\">\n          <div style=\"max-width:820px;margin:0 auto;text-align:center;\">\n            <p style=\"font-family:'Jost';font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#A9854A;margin:0 0 20px;\">Bienvenue<\u002Fp>\n            <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,4.5vw,50px);line-height:1.12;color:#15302D;margin:0 0 24px;\">Une parenthèse hors du temps, à une heure d’Alger.<\u002Fh2>\n            <p style=\"font-size:17px;line-height:1.85;font-weight:300;color:#3D4F49;\">Niché entre pins parasols et Méditerranée, Dar el Bahr conjugue l’élégance sobre des grandes maisons balnéaires et la chaleur de l’hospitalité algérienne. Chaque détail — du lin des chambres au sel de nos gommages — puise dans la lumière et les matières de la côte.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- Featured rooms -->\n        <section style=\"padding:clamp(32px,5vw,56px) clamp(16px,5vw,48px) clamp(64px,9vw,110px);\">\n          <div style=\"max-width:1240px;margin:0 auto;\">\n            <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:clamp(32px,4vw,52px);\">\n              <div>\n                <p style=\"font-family:'Jost';font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#A9854A;margin:0 0 14px;\">Chambres &amp; Suites<\u002Fp>\n                <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,4vw,46px);line-height:1.08;color:#15302D;margin:0;\">Nos plus beaux hébergements<\u002Fh2>\n              <\u002Fdiv>\n              <button onclick=\"{{ nav }}\" data-nav=\"chambres\" style=\"background:none;border:none;cursor:pointer;font-family:'Jost';font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#1E5F5A;border-bottom:1px solid #1E5F5A;padding:6px 0;\" style-hover=\"color:#B08D57;border-color:#B08D57;\" style-focus=\"outline:2px solid #1E5F5A;outline-offset:3px;\">Voir les 6 hébergements<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:28px;\">\n              <sc-for list=\"{{ roomsFeatured }}\" as=\"r\" hint-placeholder-count=\"3\">\n                <article style=\"background:#FFFDF9;border:1px solid rgba(23,48,46,.09);overflow:hidden;display:flex;flex-direction:column;\">\n                  <div style=\"position:relative;aspect-ratio:3/2;\">\n                    <image-slot id=\"{{ r.imgId }}\" src=\"{{ r.imgSrc }}\" shape=\"rect\" fit=\"cover\" placeholder=\"{{ r.slotLabel }}\" style=\"width:100%;height:100%;display:block;\"><\u002Fimage-slot>\n                    <span style=\"position:absolute;left:12px;bottom:12px;pointer-events:none;font-family:'Jost';font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#15302D;background:rgba(247,241,231,.92);padding:5px 11px;border-radius:2px;font-weight:500;\">{{ r.vue }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"padding:24px 24px 26px;display:flex;flex-direction:column;flex:1;\">\n                    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;\">\n                      <h3 style=\"font-family:'Cormorant Garamond',serif;font-size:25px;font-weight:600;color:#17302E;margin:0;\">{{ r.label }}<\u002Fh3>\n                      <span style=\"font-family:'Jost';font-size:11px;color:#8A9591;letter-spacing:.04em;white-space:nowrap;\">{{ r.size }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <p style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:#5B8B83;margin:8px 0 16px;\">{{ r.tagline }}<\u002Fp>\n                    <div style=\"margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid rgba(176,141,87,.25);padding-top:16px;gap:12px;\">\n                      <span style=\"font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:#1E5F5A;\">{{ r.prixFmt }}<span style=\"font-family:'Jost';font-size:11px;color:#8A9591;font-weight:400;\"> / nuit<\u002Fspan><\u002Fspan>\n                      <button onclick=\"{{ r.reserve }}\" style=\"font-family:'Jost';font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;padding:11px 20px;background:#1E5F5A;color:#F7F1E7;border:none;cursor:pointer;transition:background .3s ease;\" style-hover=\"background:#143f3b;\" style-focus=\"outline:2px solid #B08D57;outline-offset:2px;\">Réserver<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Farticle>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- Spa teaser -->\n        <section style=\"background:#EFE7D6;padding:clamp(64px,9vw,110px) clamp(16px,5vw,48px);\">\n          <div style=\"max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(32px,5vw,64px);align-items:center;\">\n            <div style=\"position:relative;aspect-ratio:4/3;border-radius:4px;overflow:hidden;box-shadow:0 40px 80px -50px rgba(21,48,45,.6);\">\n              <image-slot id=\"photo-spa-bassin\" src=\"{{ spaSrc }}\" shape=\"rect\" fit=\"cover\" placeholder=\"Photo — bassin de relaxation du spa\" style=\"width:100%;height:100%;display:block;\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <div>\n              <p style=\"font-family:'Jost';font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#A9854A;margin:0 0 20px;\">Le Spa<\u002Fp>\n              <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,4.2vw,48px);line-height:1.1;color:#15302D;margin:0 0 22px;\">Le rituel de la mer, sous vos sens.<\u002Fh2>\n              <p style=\"font-size:16.5px;line-height:1.85;font-weight:300;color:#3D4F49;margin:0 0 30px;max-width:460px;\">Hammam traditionnel, gommages au sel, massages à l’huile d’argan : six soins signature puisés dans les traditions du bassin méditerranéen, ouverts tous les jours de 9 h à 21 h.<\u002Fp>\n              <button onclick=\"{{ nav }}\" data-nav=\"spa\" style=\"font-family:'Jost';font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;padding:15px 32px;background:transparent;color:#17302E;border:1px solid #B08D57;cursor:pointer;transition:all .3s ease;\" style-hover=\"background:#B08D57;color:#fff;\" style-focus=\"outline:2px solid #1E5F5A;outline-offset:2px;\">Découvrir les soins<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- Avis -->\n        <section style=\"padding:clamp(64px,9vw,110px) clamp(16px,5vw,48px);\">\n          <div style=\"max-width:1240px;margin:0 auto;\">\n            <div style=\"text-align:center;margin-bottom:clamp(36px,5vw,56px);\">\n              <p style=\"font-family:'Jost';font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#A9854A;margin:0 0 14px;\">Ils ont séjourné chez nous<\u002Fp>\n              <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,4vw,46px);color:#15302D;margin:0;\">Une note moyenne de 4,8 / 5<\u002Fh2>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:24px;\">\n              <sc-for list=\"{{ avisView }}\" as=\"a\" hint-placeholder-count=\"4\">\n                <figure style=\"margin:0;background:#FFFDF9;border:1px solid rgba(23,48,46,.09);padding:28px 26px;display:flex;flex-direction:column;\">\n                  <span aria-hidden=\"true\" style=\"color:#B08D57;letter-spacing:.14em;font-size:15px;margin-bottom:16px;\">{{ a.stars }}<\u002Fspan>\n                  <blockquote style=\"margin:0 0 20px;font-family:'Cormorant Garamond',serif;font-size:20px;line-height:1.5;color:#28403B;font-style:italic;flex:1;\">« {{ a.txt }} »<\u002Fblockquote>\n                  <figcaption style=\"font-family:'Jost';font-size:13px;color:#5B6B65;\">\n                    <span style=\"font-weight:500;color:#17302E;\">{{ a.nom }}<\u002Fspan> · {{ a.ville }}\n                    <span style=\"display:block;font-size:11px;color:#9AA6A0;margin-top:3px;letter-spacing:.06em;\">{{ a.date }}<\u002Fspan>\n                  <\u002Ffigcaption>\n                <\u002Ffigure>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- CTA -->\n        <section style=\"padding:0 clamp(16px,5vw,48px) clamp(72px,9vw,120px);\">\n          <div style=\"max-width:1240px;margin:0 auto;position:relative;overflow:hidden;border-radius:4px;background:linear-gradient(150deg,#1E5F5A 0%,#15302D 100%);padding:clamp(48px,7vw,88px) clamp(24px,5vw,72px);text-align:center;\">\n            <p style=\"font-family:'Jost';font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#C6A469;margin:0 0 18px;\">Votre séjour vous attend<\u002Fp>\n            <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,4.5vw,52px);line-height:1.1;color:#F7F1E7;margin:0 0 30px;\">Réservez en quelques instants.<\u002Fh2>\n            <button onclick=\"{{ openReservation }}\" style=\"font-family:'Jost';font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;padding:16px 38px;background:#B08D57;color:#15302D;border:none;cursor:pointer;transition:background .3s ease;\" style-hover=\"background:#C6A469;\" style-focus=\"outline:2px solid #F7F1E7;outline-offset:2px;\">Réserver maintenant<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= CHAMBRES ================= -->\n    <sc-if value=\"{{ isChambres }}\">\n      <div>\n        <section style=\"background:linear-gradient(168deg,#faf4e9 0%,#eee2ca 100%);padding:clamp(56px,8vw,96px) clamp(16px,5vw,48px);text-align:center;\">\n          <p style=\"font-family:'Jost';font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#A9854A;margin:0 0 18px;\">Hébergements<\u002Fp>\n          <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(38px,6vw,66px);line-height:1.05;color:#15302D;margin:0 0 18px;\">Chambres &amp; Suites<\u002Fh1>\n          <p style=\"max-width:600px;margin:0 auto;font-size:16.5px;line-height:1.8;font-weight:300;color:#3D4F49;\">Six hébergements aux tons sable et laiton, du cocon face au jardin à la villa avec piscine privée. Tous avec petit-déjeuner inclus et accès au spa.<\u002Fp>\n        <\u002Fsection>\n        <section style=\"padding:clamp(48px,6vw,80px) clamp(16px,5vw,48px) clamp(72px,9vw,120px);\">\n          <div :flex;align-items:center;gap:9px;\"><span aria-hidden=\"true\" style=\"width:5px;height:5px;background:#B08D57;transform:rotate(45deg);flex:none;\"><\u002Fspan>{{ a }}<\u002Fli>\n                    <\u002Fsc-for>\n                  <\u002Ful>\n                  <div style=\"margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid rgba(176,141,87,.28);padding-top:20px;gap:16px;flex-wrap:wrap;\">\n                    <div>\n                      <span style=\"display:block;font-family:'Jost';font-size:11px;color:#8A9591;letter-spacing:.06em;\">À partir de<\u002Fspan>\n                      <span style=\"font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:#1E5F5A;\">{{ r.prixFmt }}<span style=\"font-family:'Jost';font-size:12px;color:#8A9591;font-weight:400;\"> / nuit<\u002Fspan><\u002Fspan>\n                    <\u002Fdiv>\n                    <button onclick=\"{{ r.reserve }}\" style=\"font-family:'Jost';font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;padding:13px 26px;background:#1E5F5A;color:#F7F1E7;border:none;cursor:pointer;transition:background .3s ease;\" style-hover=\"background:#143f3b;\" style-focus=\"outline:2px solid #B08D57;outline-offset:2px;\">Réserver<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Farticle>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= SPA ================= -->\n    <sc-if value=\"{{ isSpa }}\">\n      <div>\n        <section style=\"background:linear-gradient(168deg,#eef3ee 0%,#dbe8e1 100%);padding:clamp(56px,8vw,96px) clamp(16px,5vw,48px);text-align:center;\">\n          <p style=\"font-family:'Jost';font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#A9854A;margin:0 0 18px;\">Bien-être<\u002Fp>\n          <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-si width:1080px;margin:0 auto;background:#EFE7D6;border:1px solid rgba(176,141,87,.3);padding:clamp(28px,4vw,44px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:28px;\">\n            <div>\n              <h3 style=\"font-family:'Jost';font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#A9854A;margin:0 0 14px;font-weight:500;\">Horaires du spa<\u002Fh3>\n              <p style=\"font-size:15px;line-height:1.9;font-weight:300;color:#3D4F49;margin:0;\">Tous les jours · 9 h 00 – 21 h 00<br>Dernier soin à 20 h 00<br>Accès inclus pour les résidents<\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <h3 style=\"font-family:'Jost';font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#A9854A;margin:0 0 14px;font-weight:500;\">Bon à savoir<\u002Fh3>\n              <p style=\"font-size:15px;line-height:1.9;font-weight:300;color:#3D4F49;margin:0;\">Accès dès 16 ans · Peignoirs fournis<br>Prévoir 15 min avant le soin<br>Annulation gratuite jusqu’à 24 h<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= GALERIE ================= -->\n    <sc-if value=\"{{ isGalerie }}\">\n      <div>\n        <section style=\"background:linear-gradient(168deg,#faf4e9 0%,#eee2ca 100%);padding:clamp(56px,8vw,96px) clamp(16px,5vw,48px);text-align:center;\">\n          <p style=\"font-family:'Jost';font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#A9854A;margin:0 0 18px;\">En images<\u002Fp>\n          <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(38px,6vw,66px);line-height:1.05;color:#15302D;margin:0;\">Galerie<\u002Fh1>\n        <\u002Fsection>\n        <section style=\"padding:clamp(36px,5vw,56px) clamp(16px,5vw,48px) clamp(72px,9vw,110px);\">\n          <div style=\"max-width:1240px;margin:0 auto;\">\n            <div role=\"tablist\" aria-label=\"Filtrer la galerie\" style=\"display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:clamp(28px,4vw,44px);\">\n              <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"5\">\n                <sc-if value=\"{{ f.active }}\">\n                  <button onclick=\"{{ f.go }}\" aria-pressed=\"true\" style=\"font-family:'Jost';font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:11px 22px;background:#1E5F5A;border:1px solid #1E5F5A;color:#F7F1E7;cursor:pointer;border-radius:100px;\" style-focus=\"outline:2px solid #B08D57;outline-offset:2px;\">{{ f.label }}<\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ f.inactive }}\">\n                  <button onclick=\"{{ f.go }}\" aria-pressed=\"false\" style=\"font-family:'Jost';font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:11px 22px;background:transparent;border:1px solid rgba(23,48,46,.2);color:#3D4F49;cursor:pointer;border-radius:100px;transition:all .25s ease;\" style-hover=\"border-color:#1E5F5A;color:#1E5F5A;\" style-focus=\"outline:2px solid #1E5F5A;outline-offset:2px;\">{{ f.label }}<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;\">\n              <sc-for list=\"{{ galleryView }}\" as=\"t\" hint-placeholder-count=\"9\">\n                <div style=\"position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:3px;\">\n                  <image-slot id=\"{{ t.img }}\" src=\"{{ t.src }}\" shape=\"rect\" fit=\"cover\" placeholder=\"{{ t.slotLabel }}\" style=\"width:100%;height:100%;display:block;\"><\u002Fimage-slot>\n                  <span style=\"position:absolute;left:12px;bottom:12px;right:12px;pointer-events:none;text-align:left;font-family:'Jost';font-size:11px;letter-spacing:.02em;color:#fff;background:rgba(21,48,45,.5);backdrop-filter:blur(4px);padding:6px 11px;border-radius:2px;\">{{ t.label }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= CONTACT ================= -->\n    <sc-if value=\"{{ isContact }}\">\n      <div>\n        <section style=\"background:linear-gradient(168deg,#eef3ee 0%,#dbe8e1 100%);padding:clamp(56px,8vw,96px) clamp(16px,5vw,48px);text-align:center;\">\n          <p style=\"font-family:'Jost';font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#A9854A;margin:0 0 18px;\">Nous écrire · nous trouver<\u002Fp>\n          <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(38px,6vw,66px);line-height:1.05;color:#15302D;margin:0;\">Contact &amp; Accès<\u002Fh1>\n        <\u002Fsection>\n        <section style=\"padding:clamp(48px,6vw,80px) clamp(16px,5vw,48px) clamp(72px,9vw,110px);\">\n          <div style=\"max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(32px,5vw,56px);\">\n            <div>\n              <h2 style=\"font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;color:#17302E;margin:0 0 24px;\">Écrivez-nous<\u002Fh2>\n              <sc-if value=\"{{ contactNotSent }}\">\n                <form onsubmit=\"{{ submitContact }}\" style=\"display:flex;flex-direction:column;gap:18px;\">\n                  <div>\n                    <label for=\"c-nom\" style=\"display:block;font-family:'Jost';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8A9591;margin:0 0 8px;font-weight:500;\">Nom complet<\u002Flabel>\n                    <input id=\"c-nom\" type=\"text\" required=\"\" autocomplete=\"name\" style=\"width:100%;font-size:15px;padding:13px 14px;border:1px solid rgba(23,48,46,.2);background:#FFFDF9;color:#17302E;border-radius:2px;outline:none;\" style-focus=\"border-color:#1E5F5A;box-shadow:0 0 0 3px rgba(30,95,90,.15);\">\n                  <\u002Fdiv>\n                  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:18px;\">\n                    <div>\n                      <label for=\"c-mail\" style=\"display:block;font-family:'Jost';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8A9591;margin:0 0 8px;font-weight:500;\">E-mail<\u002Flabel>\n                      <input id=\"c-mail\" type=\"email\" required=\"\" autocomplete=\"email\" style=\"width:100%;font-size:15px;padding:13px 14px;border:1px solid rgba(23,48,46,.2);background:#FFFDF9;color:#17302E;border-radius:2px;outline:none;\" style-focus=\"border-color:#1E5F5A;box-shadow:0 0 0 3px rgba(30,95,90,.15);\">\n                    <\u002Fdiv>\n                    <div>\n                      <label for=\"c-tel\" style=\"display:block;font-family:'Jost';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8A9591;margin:0 0 8px;font-weight:500;\">Téléphone<\u002Flabel>\n                      <input id=\"c-tel\" type=\"tel\" autocomplete=\"tel\" placeholder=\"+213 _ __ __ __ __\" style=\"width:100%;font-size:15px;padding:13px 14px;border:1px solid rgba(23,48,46,.2);background:#FFFDF9;color:#17302E;border-radius:2px;outline:none;\" style-focus=\"border-color:#1E5F5A;box-shadow:0 0 0 3px rgba(30,95,90,.15);\">\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div>\n                    <label for=\"c-msg\" style=\"display:block;font-family:'Jost';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8A9591;margin:0 0 8px;font-weight:500;\">Message<\u002Flabel>\n                    <textarea id=\"c-msg\" rows=\"4\" required=\"\" style=\"width:100%;font-size:15px;padding:13px 14px;border:1px solid rgba(23,48,46,.2);background:#FFFDF9;color:#17302E;border-radius:2px;outline:none;resize:vertical;font-family:'Jost';\" style-focus=\"border-color:#1E5F5A;box-shadow:0 0 0 3px rgba(30,95,90,.15);\"><\u002Ftextarea>\n                  <\u002Fdiv>\n                  <label style=\"display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:13px;line-height:1.6;color:#3D4F49;font-weight:300;\">\n                    <input type=\"checkbox\" checked=\"{{ contactConsent }}\" onchange=\"{{ setContactConsent }}\" required=\"\" style=\"margin-top:3px;width:17px;height:17px;accent-color:#1E5F5A;flex:none;cursor:pointer;\">\n                    <span>J’accepte que mes données soient utilisées pour traiter ma demande, conformément à la <a href=\"#\" onclick=\"{{ nav }}\" data-nav=\"confidentialite\" style=\"color:#1E5F5A;text-decoration:underline;text-underline-offset:2px;\">politique de confidentialité<\u002Fa>.<\u002Fspan>\n                  <\u002Flabel>\n                  <button type=\"submit\" disabled=\"{{ contactNotConsent }}\" style=\"align-self:flex-start;font-family:'Jost';font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;padding:15px 34px;background:#1E5F5A;color:#F7F1E7;border:none;cursor:pointer;transition:background .3s ease;\" style-hover=\"background:#143f3b;\" style-focus=\"outline:2px solid #B08D57;outline-offset:2px;\">Envoyer le message<\u002Fbutton>\n                <\u002Fform>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ contactSent }}\">\n                <div role=\"status\" style=\"background:#EAF1EE;border:1px solid #9EC4BC;padding:32px 28px;border-radius:3px;\">\n                  <p style=\"font-family:'Cormorant Garamond',serif;font-size:26px;color:#1E5F5A;margin:0 0 10px;\">Merci, votre message est parti.<\u002Fp>\n                  <p style=\"font-size:15px;line-height:1.7;font-weight:300;color:#3D4F49;margin:0;\">Notre équipe vous répondra sous 24 heures. À très bientôt sur la baie de Tipaza.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div>\n              <div role=\"img\" aria-label=\"Plan d’accès à Dar el Bahr, route de la corniche, Tipaza\" style=\"position:relative;aspect-ratio:16/10;border-radius:4px;overflow:hidden;background:radial-gradient(130% 100% at 70% 20%, rgba(255,255,255,.4), transparent 55%), linear-gradient(150deg,#e7efe9 0%,#c7dcd3 48%,#8fb9b0 100%);margin-bottom:28px;box-shadow:0 30px 70px -45px rgba(21,48,45,.5);\">\n                <span aria-hidden=\"true\" style=\"position:absolute;top:50%;left:50%;transform:translate(-50%,-100%);width:22px;height:22px;background:#B84B3A;border-radius:50% 50% 50% 0;rotate:-45deg;box-shadow:0 6px 14px rgba(0,0,0,.3);\"><\u002Fspan>\n                <span style=\"position:absolute;left:14px;bottom:14px;font-family:ui-monospace,monospace;font-size:10px;color:#fff;background:rgba(21,48,45,.42);backdrop-filter:blur(4px);padding:6px 10px;border-radius:2px;\">PLAN · route de la corniche, baie de Tipaza<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:24px 28px;\">\n                <div>\n                  <h3 style=\"font-family:'Jost';font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#A9854A;margin:0 0 10px;font-weight:500;\">Adresse<\u002Fh3>\n                  <p style=\"font-size:14.5px;line-height:1.75;font-weight:300;color:#3D4F49;margin:0;\">Route de la Corniche<br>Baie de Tipaza<br>42000 Tipaza, Algérie<\u002Fp>\n                <\u002Fdiv>\n                <div>\n                  <h3 style=\"font-family:'Jost';font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#A9854A;margin:0 0 10px;font-weight:500;\">Nous joindre<\u002Fh3>\n                  <p style=\"font-size:14.5px;line-height:1.75;font-weight:300;color:#3D4F49;margin:0;\">Tél. +213 _ __ __ __ __<br>reservations@darelbahr.dz<br>Réception ouverte 24 h/24<\u002Fp>\n                <\u002Fdiv>\n                <div>\n                  <h3 style=\"font-family:'Jost';font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#A9854A;margin:0 0 10px;font-weight:500;\">Accès<\u002Fh3>\n                  <p style=\"font-size:14.5px;line-height:1.75;font-weight:300;color:#3D4F49;margin:0;\">À 70 km à l’ouest d’Alger<br>Aéroport Alger — 1 h 10<br>Voiturier &amp; parking privé<\u002Fp>\n                <\u002Fdiv>\n                <div>\n                  <h3 style=\"font-family:'Jost';font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#A9854A;margin:0 0 10px;font-weight:500;\">Restaurant<\u002Fh3>\n                  <p style=\"font-size:14.5px;line-height:1.75;font-weight:300;color:#3D4F49;margin:0;\">Le Phare · 7 h – 23 h<br>Piscine · 8 h – 20 h<br>Spa · 9 h – 21 h<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= RESERVATION (moment fort) ================= -->\n    <sc-if value=\"{{ isReservation }}\">\n      <div>\n        <section style=\"background:linear-gradient(168deg,#faf4e9 0%,#eee2ca 100%);padding:clamp(48px,7vw,80px) clamp(16px,5vw,48px);text-align:center;\">\n          <p style=\"font-family:'Jost';font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#A9854A;margin:0 0 16px;\">Réservation en ligne<\u002Fp>\n          <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(34px,5.5vw,58px);line-height:1.05;color:#15302D;margin:0;\">Composez votre séjour<\u002Fh1>\n        <\u002Fsection>\n\n        <sc-if value=\"{{ confirmed }}\">\n          <section style=\"padding:clamp(48px,6vw,80px) clamp(16px,5vw,48px) clamp(72px,9vw,110px);\">\n            <div role=\"status\" style=\"max-width:720px;margin:0 auto;background:#FFFDF9;border:1px solid #9EC4BC;border-top:4px solid #1E5F5A;padding:clamp(32px,4vw,52px);\">\n              <p style=\"font-family:'Jost';font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#5B8B83;margin:0 0 10px;\">Demande confirmée<\u002Fp>\n              <h2 style=\"font-family:'Cormorant Garamond',serif;font-size:clamp(28px,4vw,40px);font-weight:600;color:#15302D;margin:0 0 8px;\">Votre séjour est réservé.<\u002Fh2>\n              <p style=\"font-size:15.5px;line-height:1.75;font-weight:300;color:#3D4F49;margin:0 0 28px;\">Un e-mail de confirmation vient de vous être envoyé. Le règlement de l’acompte finalise la réservation. Référence : <strong style=\"font-family:ui-monospace,monospace;color:#1E5F5A;letter-spacing:.04em;\">{{ bookingRef }}<\u002Fstrong><\u002Fp>\n              <div style=\"border-top:1px solid rgba(176,141,87,.28);padding-top:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:20px 28px;\">\n                <div><span style=\"display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A9591;margin-bottom:6px;\">Hébergement<\u002Fspan><span style=\"font-family:'Cormorant Garamond',serif;font-size:20px;color:#17302E;\">{{ selName }}<\u002Fspan><\u002Fdiv>\n                <div><span style=\"display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A9591;margin-bottom:6px;\">Arrivée<\u002Fspan><span style=\"font-family:'Cormorant Garamond',serif;font-size:20px;color:#17302E;text-transform:capitalize;\">{{ arriveeLabel }}<\u002Fspan><\u002Fdiv>\n                <div><span style=\"display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A9591;margin-bottom:6px;\">Départ<\u002Fspan><span style=\"font-family:'Cormorant Garamond',serif;font-size:20px;color:#17302E;text-transform:capitalize;\">{{ departLabel }}<\u002Fspan><\u002Fdiv>\n                <div><span style=\"display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A9591;margin-bottom:6px;\">Voyageurs<\u002Fspan><span style=\"font-family:'Cormorant Garamond',serif;font-size:20px;color:#17302E;\">{{ voyageurs }}<\u002Fspan><\u002Fdiv>\n                <div><span style=\"display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A9591;margin-bottom:6px;\">Total séjour<\u002Fspan><span style=\"font-family:'Cormorant Garamond',serif;font-size:20px;color:#1E5F5A;\">{{ totalFmt }}<\u002Fspan><\u002Fdiv>\n                <div><span style=\"display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A9591;margin-bottom:6px;\">Acompte (30 %)<\u002Fspan><span style=\"font-family:'Cormorant Garamond',serif;font-size:20px;color:#1E5F5A;\">{{ acompteFmt }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:14px;margin-top:32px;\">\n                <button onclick=\"{{ resetBooking }}\" style=\"font-family:'Jost';font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;padding:14px 28px;background:#1E5F5A;color:#F7F1E7;border:none;cursor:pointer;\" style-hover=\"background:#143f3b;\" style-focus=\"outline:2px solid #B08D57;outline-offset:2px;\">Modifier la réservation<\u002Fbutton>\n                <button onclick=\"{{ nav }}\" data-nav=\"accueil\" style=\"font-family:'Jost';font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;padding:14px 28px;background:transparent;color:#17302E;border:1px solid #B08D57;cursor:pointer;\" style-hover=\"background:#B08D57;color:#fff;\" style-focus=\"outline:2px solid #1E5F5A;outline-offset:2px;\">Retour à l’accueil<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ notConfirmed }}\">\n          <section style=\"padding:clamp(40px,5vw,64px) clamp(16px,5vw,48px) clamp(72px,9vw,110px);\">\n            <div style=\"max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:32px;align-items:start;\">\n              <!-- Left: form -->\n              <div style=\"background:#FFFDF9;border:1px solid rgba(23,48,46,.09);padding:clamp(24px,3vw,36px);\">\n                <h2 style=\"font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:#17302E;margin:0 0 24px;\">Vos dates &amp; votre chambre<\u002Fh2>\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px;\">\n                  <div>\n                    <label for=\"r-arr\" style=\"display:block;font-family:'Jost';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8A9591;margin:0 0 8px;font-weight:500;\">Arrivée<\u002Flabel>\n                    <input id=\"r-arr\" type=\"date\" value=\"{{ arrivee }}\" min=\"{{ today }}\" onchange=\"{{ setArrivee }}\" style=\"width:100%;font-size:15px;padding:13px 12px;border:1px solid rgba(23,48,46,.2);background:#fff;color:#17302E;border-radius:2px;outline:none;\" style-focus=\"border-color:#1E5F5A;box-shadow:0 0 0 3px rgba(30,95,90,.15);\">\n                  <\u002Fdiv>\n                  <div>\n                    <label for=\"r-dep\" style=\"display:block;font-family:'Jost';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8A9591;margin:0 0 8px;font-weight:500;\">Départ<\u002Flabel>\n                    <input id=\"r-dep\" type=\"date\" value=\"{{ depart }}\" min=\"{{ arrivee }}\" onchange=\"{{ setDepart }}\" style=\"width:100%;font-size:15px;padding:13px 12px;border:1px solid rgba(23,48,46,.2);background:#fff;color:#17302E;border-radius:2px;outline:none;\" style-focus=\"border-color:#1E5F5A;box-shadow:0 0 0 3px rgba(30,95,90,.15);\">\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"margin-bottom:20px;\">\n                  <label for=\"r-room\" style=\"display:block;font-family:'Jost';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8A9591;margin:0 0 8px;font-weight:500;\">Hébergement<\u002Flabel>\n                  <select id=\"r-room\" value=\"{{ roomId }}\" onchange=\"{{ setRoom }}\" style=\"width:100%;font-size:15px;padding:13px 12px;border:1px solid rgba(23,48,46,.2);background:#fff;color:#17302E;border-radius:2px;outline:none;cursor:pointer;\" style-focus=\"border-color:#1E5F5A;box-shadow:0 0 0 3px rgba(30,95,90,.15);\">\n                    <sc-for list=\"{{ roomsView }}\" as=\"r\" hint-placeholder-count=\"6\"><option value=\"{{ r.id }}\">{{ r.optLabel }}<\u002Foption><\u002Fsc-for>\n                  <\u002Fselect>\n                <\u002Fdiv>\n                <div style=\"margin-bottom:24px;\">\n                  <span style=\"display:block;font-family:'Jost';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8A9591;margin:0 0 8px;font-weight:500;\">Voyageurs<\u002Fspan>\n                  <div style=\"display:flex;align-items:center;gap:16px;\">\n                    <button type=\"button\" onclick=\"{{ decGuests }}\" aria-label=\"Retirer un voyageur\" style=\"width:44px;height:44px;border:1px solid rgba(23,48,46,.25);background:#fff;color:#17302E;font-size:20px;cursor:pointer;border-radius:2px;line-height:1;\" style-hover=\"border-color:#1E5F5A;color:#1E5F5A;\" style-focus=\"outline:2px solid #1E5F5A;outline-offset:2px;\">–<\u002Fbutton>\n                    <span aria-live=\"polite\" style=\"font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:#17302E;min-width:28px;text-align:center;\">{{ voyageurs }}<\u002Fspan>\n                    <button type=\"button\" onclick=\"{{ incGuests }}\" aria-label=\"Ajouter un voyageur\" style=\"width:44px;height:44px;border:1px solid rgba(23,48,46,.25);background:#fff;color:#17302E;font-size:20px;cursor:pointer;border-radius:2px;line-height:1;\" style-hover=\"border-color:#1E5F5A;color:#1E5F5A;\" style-focus=\"outline:2px solid #1E5F5A;outline-offset:2px;\">+<\u002Fbutton>\n                    <span style=\"font-size:12.5px;color:#8A9591;font-weight:300;\">Capacité max. : {{ selCap }} pers.<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"position:relative;aspect-ratio:16/9;border-radius:3px;overflow:hidden;\">\n                  <image-slot id=\"{{ selImgId }}\" src=\"{{ selImgSrc }}\" shape=\"rect\" fit=\"cover\" placeholder=\"{{ selSlotLabel }}\" style=\"width:100%;height:100%;display:block;\"><\u002Fimage-slot>\n                  <span style=\"position:absolute;left:14px;bottom:14px;pointer-events:none;font-family:'Jost';font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#15302D;background:rgba(247,241,231,.92);padding:6px 12px;border-radius:2px;font-weight:500;\">{{ selName }} · {{ selVue }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <!-- Right: summary -->\n              <div style=\"position:sticky;top:92px;\">\n                <div style=\"background:#15302D;color:#EDE4D3;padding:clamp(24px,3vw,32px);\">\n                  <p style=\"font-family:'Jost';font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#C6A469;margin:0 0 20px;\">Récapitulatif<\u002Fp>\n                  <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;\">\n                    <span style=\"font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:#F7F1E7;\">{{ selName }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <p style=\"font-size:12.5px;color:#A9BDB6;margin:0 0 22px;font-weight:300;\">{{ selSize }} · {{ selBed }} · {{ selVue }}<\u002Fp>\n\n                  <div style=\"border-top:1px solid rgba(198,164,105,.3);padding-top:18px;display:flex;flex-direction:column;gap:12px;font-size:14px;\">\n                    <div style=\"display:flex;justify-content:space-between;\"><span style=\"color:#BBCCC6;font-weight:300;\">Durée<\u002Fspan><span style=\"color:#F7F1E7;\">{{ nightsLabel }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"display:flex;justify-content:space-between;\"><span style=\"color:#BBCCC6;font-weight:300;\">Prix / nuit<\u002Fspan><span style=\"color:#F7F1E7;\">{{ selPrixFmt }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"display:flex;justify-content:space-between;\"><span style=\"color:#BBCCC6;font-weight:300;\">Sous-total<\u002Fspan><span style=\"color:#F7F1E7;\">{{ subtotalFmt }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"display:flex;justify-content:space-between;\"><span style=\"color:#BBCCC6;font-weight:300;\">Taxe de séjour<\u002Fspan><span style=\"color:#F7F1E7;\">{{ taxeFmt }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"border-top:1px solid rgba(198,164,105,.3);margin-top:18px;padding-top:18px;display:flex;justify-content:space-between;align-items:baseline;\">\n                    <span style=\"font-family:'Jost';font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#C6A469;\">Total<\u002Fspan>\n                    <span style=\"font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;color:#F7F1E7;\">{{ totalFmt }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;font-size:13px;margin-top:8px;color:#BBCCC6;font-weight:300;\"><span>Acompte à régler (30 %)<\u002Fspan><span style=\"color:#C6A469;\">{{ acompteFmt }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;font-size:13px;margin-top:4px;color:#BBCCC6;font-weight:300;\"><span>Solde à l’arrivée<\u002Fspan><span>{{ soldeFmt }}<\u002Fspan><\u002Fdiv>\n\n                  <div style=\"background:rgba(198,164,105,.12);border:1px solid rgba(198,164,105,.28);padding:14px 16px;margin-top:22px;font-size:12.5px;line-height:1.6;color:#DED3BF;font-weight:300;\">\n                    <strong style=\"color:#F7F1E7;font-weight:500;\">Politique d’annulation.<\u002Fstrong> Annulation gratuite jusqu’à 48 h avant l’arrivée. Passé ce délai, l’acompte de 30 % est retenu.\n                  <\u002Fdiv>\n\n                  <label style=\"display:flex;gap:11px;align-items:flex-start;cursor:pointer;font-size:12.5px;line-height:1.6;color:#DED3BF;font-weight:300;margin-top:20px;\">\n                    <input type=\"checkbox\" checked=\"{{ consent }}\" onchange=\"{{ toggleConsent }}\" style=\"margin-top:2px;width:17px;height:17px;accent-color:#C6A469;flex:none;cursor:pointer;\">\n                    <span>J’accepte la politique d’acompte et d’annulation ainsi que la <a href=\"#\" onclick=\"{{ nav }}\" data-nav=\"confidentialite\" style=\"color:#C6A469;text-decoration:underline;text-underline-offset:2px;\">politique de confidentialité<\u002Fa>.<\u002Fspan>\n                  <\u002Flabel>\n\n                  <sc-if value=\"{{ notValid }}\"><p style=\"font-size:12px;color:#E8B79E;margin:16px 0 0;font-weight:300;\">Sélectionnez une date de départ postérieure à la date d’arrivée.<\u002Fp><\u002Fsc-if>\n\n                  <button onclick=\"{{ confirmBooking }}\" disabled=\"{{ cannotConfirm }}\" style=\"width:100%;margin-top:20px;font-family:'Jost';font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;padding:16px;background:#C6A469;color:#15302D;border:none;cursor:pointer;transition:background .3s ease,opacity .3s ease;opacity:1;\" style-hover=\"background:#D6B57A;\" style-focus=\"outline:2px solid #F7F1E7;outline-offset:2px;\">Confirmer la réservation<\u002Fbutton>\n                  <p style=\"text-align:center;font-size:11.5px;color:#A9BDB6;margin:12px 0 0;font-weight:300;\">Aucun paiement immédiat · demande sans engagement<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= MENTIONS LEGALES ================= -->\n    <sc-if value=\"{{ isMentions }}\">\n      <div style=\"max-width:760px;margin:0 auto;padding:clamp(56px,8vw,96px) clamp(20px,5vw,48px);\">\n        <p style=\"font-family:'Jost';font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#A9854A;margin:0 0 16px;\">Informations légales<\u002Fp>\n        <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(34px,5vw,50px);color:#15302D;margin:0 0 32px;\">Mentions légales<\u002Fh1>\n        <div style=\"font-size:15px;line-height:1.85;font-weight:300;color:#3D4F49;\">\n          <h2 style=\"font-family:'Cormorant Garamond',serif;font-size:24px;color:#17302E;margin:28px 0 10px;font-weight:600;\">Éditeur du site<\u002Fh2>\n          <p style=\"margin:0 0 12px;\">Dar el Bahr — Hôtel &amp; Spa (SARL), au capital de 40 000 000 DA. Route de la Corniche, Baie de Tipaza, 42000 Tipaza, Algérie. Registre du commerce n° 42/00-XXXXXXX B 26. Directeur de la publication : la direction générale de l’établissement.<\u002Fp>\n          <h2 style=\"font-family:'Cormorant Garamond',serif;font-size:24px;color:#17302E;margin:28px 0 10px;font-weight:600;\">Contact<\u002Fh2>\n          <p style=\"margin:0 0 12px;\">Tél. +213 _ __ __ __ __ · reservations@darelbahr.dz<\u002Fp>\n          <h2 style=\"font-family:'Cormorant Garamond',serif;font-size:24px;color:#17302E;margin:28px 0 10px;font-weight:600;\">Hébergement du site<\u002Fh2>\n          <p style=\"margin:0 0 12px;\">Ce site de démonstration est hébergé par le studio de son concepteur. Les contenus, textes et visuels sont fournis à titre illustratif.<\u002Fp>\n          <h2 style=\"font-family:'Cormorant Garamond',serif;font-size:24px;color:#17302E;margin:28px 0 10px;font-weight:600;\">Propriété intellectuelle<\u002Fh2>\n          <p style=\"margin:0 0 12px;\">L’ensemble des éléments du site (textes, mises en page, éléments graphiques) est protégé. Toute reproduction sans autorisation est interdite. Données présentées à des fins de démonstration.<\u002Fp>\n        <\u002Fdiv>\n        <button onclick=\"{{ nav }}\" data-nav=\"accueil\" style=\"margin-top:36px;background:none;border:none;cursor:pointer;font-family:'Jost';font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#1E5F5A;border-bottom:1px solid #1E5F5A;padding:6px 0;\" style-hover=\"color:#B08D57;border-color:#B08D57;\" style-focus=\"outline:2px solid #1E5F5A;outline-offset:3px;\">← Retour à l’accueil<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= CONFIDENTIALITE ================= -->\n    <sc-if value=\"{{ isConfidentialite }}\">\n      <div style=\"max-width:760px;margin:0 auto;padding:clamp(56px,8vw,96px) clamp(20px,5vw,48px);\">\n        <p style=\"font-family:'Jost';font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#A9854A;margin:0 0 16px;\">Vos données<\u002Fp>\n        <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(34px,5vw,50px);color:#15302D;margin:0 0 32px;\">Politique de confidentialité<\u002Fh1>\n        <div style=\"font-size:15px;line-height:1.85;font-weight:300;color:#3D4F49;\">\n          <p style=\"margin:0 0 12px;\">Nous attachons une grande importance à la protection de vos données personnelles. Cette politique décrit comment elles sont collectées et utilisées.<\u002Fp>\n          <h2 style=\"font-family:'Cormorant Garamond',serif;font-size:24px;color:#17302E;margin:28px 0 10px;font-weight:600;\">Données collectées<\u002Fh2>\n          <p style=\"margin:0 0 12px;\">Lors d’une réservation ou d’une prise de contact : nom, e-mail, téléphone, dates et préférences de séjour. Ces informations servent uniquement à traiter votre demande.<\u002Fp>\n          <h2 style=\"font-family:'Cormorant Garamond',serif;font-size:24px;color:#17302E;margin:28px 0 10px;font-weight:600;\">Cookies<\u002Fh2>\n          <p style=\"margin:0 0 12px;\">Le site utilise des cookies de mesure d’audience, soumis à votre consentement via le bandeau prévu à cet effet. Vous pouvez les accepter ou les refuser à tout moment.<\u002Fp>\n          <h2 style=\"font-family:'Cormorant Garamond',serif;font-size:24px;color:#17302E;margin:28px 0 10px;font-weight:600;\">Vos droits<\u002Fh2>\n          <p style=\"margin:0 0 12px;\">Vous disposez d’un droit d’accès, de rectification et de suppression de vos données. Pour l’exercer, écrivez-nous à reservations@darelbahr.dz.<\u002Fp>\n          <h2 style=\"font-family:'Cormorant Garamond',serif;font-size:24px;color:#17302E;margin:28px 0 10px;font-weight:600;\">Conservation<\u002Fh2>\n          <p style=\"margin:0 0 12px;\">Vos données sont conservées le temps nécessaire au traitement de votre séjour, puis archivées ou supprimées conformément à la réglementation en vigueur.<\u002Fp>\n        <\u002Fdiv>\n        <button onclick=\"{{ nav }}\" data-nav=\"accueil\" style=\"margin-top:36px;background:none;border:none;cursor:pointer;font-family:'Jost';font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#1E5F5A;border-bottom:1px solid #1E5F5A;padding:6px 0;\" style-hover=\"color:#B08D57;border-color:#B08D57;\" style-focus=\"outline:2px solid #1E5F5A;outline-offset:3px;\">← Retour à l’accueil<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <!-- ================= FOOTER ================= -->\n  <footer style=\"background:#15302D;color:#C9D4CF;padding:clamp(56px,7vw,88px) clamp(16px,5vw,48px) 0;\">\n    <div style=\"max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:40px;padding-bottom:clamp(40px,5vw,64px);\">\n      <div style=\"grid-column:1/-1;max-width:360px;\">\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:18px;\">\n          <span aria-hidden=\"true\" style=\"width:15px;height:15px;background:#B08D57;transform:rotate(45deg);display:inline-block;\"><\u002Fspan>\n          <span style=\"font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;letter-spacing:.04em;color:#F7F1E7;\">Dar el Bahr<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size:14px;line-height:1.8;font-weight:300;color:#9DB0AA;margin:0;\">Hôtel &amp; Spa balnéaire sur la baie de Tipaza. L’art de recevoir, entre pins parasols et Méditerranée.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h3 style=\"font-family:'Jost';font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#C6A469;margin:0 0 18px;font-weight:500;\">Explorer<\u002Fh3>\n        <nav aria-label=\"Liens de pied de page\" style=\"display:flex;flex-direction:column;gap:11px;\">\n          <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"5\">\n            <button onclick=\"{{ item.go }}\" style=\"text-align:left;background:none;border:none;cursor:pointer;font-family:'Jost';font-size:14px;color:#C9D4CF;font-weight:300;padding:0;transition:color .25s ease;\" style-hover=\"color:#F7F1E7;\" style-focus=\"outline:2px solid #C6A469;outline-offset:2px;\">{{ item.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fnav>\n      <\u002Fdiv>\n      <div>\n        <h3 style=\"font-family:'Jost';font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#C6A469;margin:0 0 18px;font-weight:500;\">Nous contacter<\u002Fh3>\n        <p style=\"font-size:14px;line-height:1.9;font-weight:300;color:#9DB0AA;margin:0;\">Route de la Corniche<br>42000 Tipaza, Algérie<br>Tél. +213 _ __ __ __ __<br>reservations@darelbahr.dz<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h3 style=\"font-family:'Jost';font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#C6A469;margin:0 0 18px;font-weight:500;\">Informations<\u002Fh3>\n        <nav aria-label=\"Liens légaux\" style=\"display:flex;flex-direction:column;gap:11px;\">\n          <button onclick=\"{{ nav }}\" data-nav=\"mentions\" style=\"text-align:left;background:none;border:none;cursor:pointer;font-family:'Jost';font-size:14px;color:#C9D4CF;font-weight:300;padding:0;\" style-hover=\"color:#F7F1E7;\" style-focus=\"outline:2px solid #C6A469;outline-offset:2px;\">Mentions légales<\u002Fbutton>\n          <button onclick=\"{{ nav }}\" data-nav=\"confidentialite\" style=\"text-align:left;background:none;border:none;cursor:pointer;font-family:'Jost';font-size:14px;color:#C9D4CF;  vue:'Vue mer panoramique', tagline:'180° sur la baie.', desc:\"Au dernier étage, une suite d’angle aux baies vitrées panoramiques, terrasse solarium et service majordome. Notre plus belle vue.\", amen:['Vue panoramique 180°','Terrasse solarium','Service majordome','Wi-Fi fibre','Bar privatif','Baignoire îlot vue mer'], bg:this.G5, img:'photos/panorama.jpg'},\n    {id:'villa', label:'Villa Bahr', size:'140 m²', bed:'2 chambres · 6 pers.', cap:6, prix:145000, vue:'Piscine privée', tagline:'Votre refuge, les pieds dans l’eau.', desc:\"Une villa indépendante avec piscine privée chauffée, jardin clos et accès direct à la plage. Pensée pour les familles et les séjours d’exception.\", amen:['Piscine privée chauffée','Accès plage direct','Jardin clos','Cuisine équipée','Service majordome','Parking privé'], bg:this.G6, img:'photos/villa.jpg'},\n  ];\n  soins=[\n    {nom:'Rituel Hammam Traditionnel', duree:'90 min', prix:9500, desc:'Gommage au savon noir, gant de kessa et modelage relaxant sous la vapeur.'},\n    {nom:'Massage aux Huiles d’Argan', duree:'60 min', prix:7200, desc:'Modelage corps complet aux huiles d’argan bio pressées à froid.'},\n    {nom:'Soin Visage Éclat Marin', duree:'75 min', prix:8800, desc:'Nettoyage, exfoliation et masque aux actifs marins pour une peau repulpée.'},\n    {nom:'Enveloppement aux Algues', duree:'45 min', prix:6500, desc:'Cocon détoxifiant et reminéralisant aux algues de Méditerranée.'},\n    {nom:'Rituel Duo Évasion', duree:'120 min', prix:18000, desc:'Parenthèse à deux : hammam, gommage et massage côte à côte en cabine privée.'},\n    {nom:'Gommage au Sel de Mer', duree:'30 min', prix:4800, desc:'Exfoliation vivifiante au sel de mer et huiles essentielles d’agrumes.'},\n  ];\n  avis=[\n    {nom:'Yasmine B.', ville:'Alger', note:5, date:'Mai 2026', txt:'Un week-end parfait. La Suite Corail au réveil, face à la mer, restera un souvenir inoubliable. Service d’une délicatesse rare.'},\n    {nom:'Karim & Nadia', ville:'Oran', note:5, date:
